<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC TURBO RACER 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0e15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .ui-box {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            padding: 10px 20px;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
            text-align: center;
            min-width: 100px;
        }

        #controls-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .control-btn:active {
            background: rgba(0, 210, 255, 0.5);
            transform: scale(0.95);
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
        }

        #game-over-screen h1 {
            font-size: 48px;
            color: #ff3333;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.7);
        }

        #restart-btn {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
            transition: all 0.2s ease;
        }

        #restart-btn:hover {
            transform: scale(1.05);
            background: #ffe066;
        }
    </style>
    <!-- Three.js y GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="ui-box">NIVEL: <span id="level-val">1</span></div>
        <div class="ui-box">PTS: <span id="score-val">0</span> / 100</div>
        <div class="ui-box">VIDAS: <span id="lives-val">❤️❤️❤️</span></div>
    </div>

    <div id="controls-container">
        <div class="btn-group">
            <div class="control-btn" id="btn-left">❮</div>
            <div class="control-btn" id="btn-right">❯</div>
        </div>
        <div class="btn-group">
            <div class="control-btn" id="btn-brake">🛑</div>
            <div class="control-btn" id="btn-boost">⚡</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>¡GAME OVER!</h1>
        <p id="final-score" style="font-size: 22px;">Puntuación Final: 0</p>
        <button id="restart-btn" onclick="resetGame()">REINTENTAR</button>
    </div>

    <script>
        // --- CONFIGURACIÓN PRINCIPAL DE THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0e15);
        scene.fog = new THREE.FogExp2(0x0d0e15, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- PISTA DE CARRERAS ---
        const roadWidth = 10;
        const roadGeo = new THREE.PlaneGeometry(roadWidth, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333338, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -450;
        scene.add(road);

        // Líneas laterales
        const lineGeo = new THREE.PlaneGeometry(0.3, 1000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        
        const leftLine = new THREE.Mesh(lineGeo, lineMat);
        leftLine.rotation.x = -Math.PI / 2;
        leftLine.position.set(-roadWidth / 2 + 0.2, 0.01, -450);
        scene.add(leftLine);

        const rightLine = new THREE.Mesh(lineGeo, lineMat);
        rightLine.rotation.x = -Math.PI / 2;
        rightLine.position.set(roadWidth / 2 - 0.2, 0.01, -450);
        scene.add(rightLine);

        // --- JUGADOR (Malla Base + Carga GLB Segura) ---
        let playerCar = null;
        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 0.6, 2.2),
            new THREE.MeshStandardMaterial({ color: 0x00d2ff })
        );
        playerMesh.position.set(0, 0.3, 0);
        scene.add(playerMesh);

        // Intentar cargar player_car.glb desde la raíz
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load('./player_car.glb', (gltf) => {
            playerCar = gltf.scene;
            playerCar.scale.set(0.5, 0.5, 0.5);
            playerCar.position.set(0, 0.1, 0);
            playerCar.rotation.y = Math.PI;
            
            playerMesh.visible = false; // Oculta el cubo si el auto carga bien
            scene.add(playerCar);
        }, undefined, (error) => {
            console.warn("No se pudo cargar player_car.glb. Se mantiene la malla predeterminada.");
            playerMesh.visible = true;
        });

        // --- ESTADO DEL JUEGO ---
        let currentLane = 0; // -1: Izquierda, 0: Centro, 1: Derecha
        const lanePositions = [-3, 0, 3];
        let targetX = 0;
        
        let score = 0;
        let level = 1;
        let lives = 3;
        let baseSpeed = 0.4;
        let currentSpeed = baseSpeed;
        let isGameOver = false;

        const obstacles = [];
        const collectibles = [];

        // --- CÁMARA ---
        camera.position.set(0, 3.5, 6);
        camera.lookAt(0, 1, -5);

        // --- TECLADO ---
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > -1) {
                currentLane--;
            }
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 1) {
                currentLane++;
            }
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                currentSpeed = baseSpeed * 1.8;
            }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                currentSpeed = baseSpeed * 0.5;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                currentSpeed = baseSpeed;
            }
        });

        // --- CONTROLES TÁCTILES ---
        const bindBtn = (id, actionDown, actionUp) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionDown(); });
            btn.addEventListener('mousedown', actionDown);
            if (actionUp) {
                btn.addEventListener('touchend', (e) => { e.preventDefault(); actionUp(); });
                btn.addEventListener('mouseup', actionUp);
            }
        };

        bindBtn('btn-left', () => { if (!isGameOver && currentLane > -1) currentLane--; });
        bindBtn('btn-right', () => { if (!isGameOver && currentLane < 1) currentLane++; });
        bindBtn('btn-boost', () => { if (!isGameOver) currentSpeed = baseSpeed * 1.8; }, () => { currentSpeed = baseSpeed; });
        bindBtn('btn-brake', () => { if (!isGameOver) currentSpeed = baseSpeed * 0.5; }, () => { currentSpeed = baseSpeed; });

        // --- GENERACIÓN DE ELEMENTOS ---
        function spawnObstacle() {
            if (isGameOver) return;
            const geo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xd9534f });
            const obs = new THREE.Mesh(geo, mat);
            const lane = Math.floor(Math.random() * 3) - 1;
            obs.position.set(lanePositions[lane + 1], 0.6, -80);
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnCollectible() {
            if (isGameOver) return;
            const geo = new THREE.SphereGeometry(0.4, 16, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0x886600 });
            const item = new THREE.Mesh(geo, mat);
            const lane = Math.floor(Math.random() * 3) - 1;
            item.position.set(lanePositions[lane + 1], 0.6, -80);
            scene.add(item);
            collectibles.push(item);
        }

        let spawnTimer = 0;

        // --- BUCLE PRINCIPAL DE ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                // Suavizar movimiento horizontal
                targetX = lanePositions[currentLane + 1];
                const activePlayer = (playerCar && playerCar.parent) ? playerCar : playerMesh;
                activePlayer.position.x += (targetX - activePlayer.position.x) * 0.15;

                // Spawns
                spawnTimer += 0.016;
                if (spawnTimer > 1.2) {
                    spawnTimer = 0;
                    if (Math.random() > 0.4) spawnObstacle();
                    if (Math.random() > 0.3) spawnCollectible();
                }

                // Mover obstáculos
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += currentSpeed;

                    // Colisión
                    if (Math.abs(obs.position.z - activePlayer.position.z) < 1.2 &&
                        Math.abs(obs.position.x - activePlayer.position.x) < 0.8) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        lives--;
                        updateUI();
                        if (lives <= 0) triggerGameOver();
                        continue;
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Mover coleccionables
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const item = collectibles[i];
                    item.position.z += currentSpeed;
                    item.rotation.y += 0.03;

                    // Recolección
                    if (Math.abs(item.position.z - activePlayer.position.z) < 1.2 &&
                        Math.abs(item.position.x - activePlayer.position.x) < 0.8) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                        score += 5;
                        if (score >= level * 100) {
                            level++;
                            baseSpeed += 0.05;
                        }
                        updateUI();
                        continue;
                    }

                    if (item.position.z > 10) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function updateUI() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('level-val').innerText = level;
            document.getElementById('lives-val').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Puntuación Final: ${score}`;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            collectibles.forEach(item => scene.remove(item));
            obstacles.length = 0;
            collectibles.length = 0;

            score = 0;
            level = 1;
            lives = 3;
            baseSpeed = 0.4;
            currentSpeed = baseSpeed;
            currentLane = 0;
            isGameOver = false;

            const activePlayer = (playerCar && playerCar.parent) ? playerCar : playerMesh;
            activePlayer.position.set(0, 0.3, 0);

            updateUI();
            document.getElementById('game-over-screen').style.display = 'none';
        }

        // Ajustar pantalla al redimensionar ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
