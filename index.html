<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GNC TURBO RACER 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030408;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      touch-action: none;
    }

    /* Contenedor Principal con Soporte para TV Vertical */
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      transition: transform 0.3s ease;
    }

    .rotate-90 {
      transform: rotate(90deg);
      transform-origin: center;
      width: 100vh !important;
      height: 100vw !important;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -50vw;
      margin-left: -50vh;
    }

    .rotate-270 {
      transform: rotate(-90deg);
      transform-origin: center;
      width: 100vh !important;
      height: 100vw !important;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -50vw;
      margin-left: -50vh;
    }

    canvas { display: block; width: 100%; height: 100%; }

    /* Botón flotante para abrir configuración */
    #settings-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-size: 22px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    /* Overlay / Modal de Configuración */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .modal-content {
      background: #111420;
      border: 2px solid #00f0ff;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    .modal-content h2 {
      margin-bottom: 20px;
      color: #00f0ff;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .setting-group { margin-bottom: 18px; }
    .setting-group label { display: block; margin-bottom: 8px; font-size: 14px; }
    .setting-group select, .setting-group input[type="range"], .setting-group input[type="password"] {
      width: 100%;
      padding: 10px;
      background: #1b2033;
      border: 1px solid #3d496e;
      color: #fff;
      border-radius: 6px;
      outline: none;
      font-size: 16px;
    }

    .setting-group input[type="password"] {
      text-align: center;
      letter-spacing: 4px;
    }

    .btn-apply {
      width: 100%;
      padding: 12px;
      background: #00f0ff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .btn-close {
      width: 100%;
      padding: 10px;
      background: #3d496e;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }

    .error-msg {
      color: #ff4757;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="game-container">
    <button id="settings-btn" onclick="openSettingsModal()">⚙️</button>

    <!-- Modal de Autenticación y Configuración -->
    <div id="settings-modal" class="modal">
      <div class="modal-content">
        
        <!-- Vista 1: Bloqueo de Acceso (Password) -->
        <div id="auth-section">
          <h2>Acceso Restringido</h2>
          <div class="setting-group">
            <label for="admin-pass">Ingrese Clave de Operador:</label>
            <input type="password" id="admin-pass" placeholder="••••••" maxlength="10">
            <div id="auth-error" class="error-msg">Clave incorrecta. Intente nuevamente.</div>
          </div>
          <button class="btn-apply" onclick="validatePassword()">Ingresar</button>
          <button class="btn-close" onclick="closeSettingsModal()">Cancelar</button>
        </div>

        <!-- Vista 2: Panel de Ajustes (Protegido) -->
        <div id="controls-section" style="display: none;">
          <h2>Configuración</h2>
          
          <div class="setting-group">
            <label for="master-volume">Volumen Master: <span id="vol-val">100%</span></label>
            <input type="range" id="master-volume" min="0" max="300" value="100">
          </div>

          <div class="setting-group">
            <label for="graphics-quality">Calidad Gráfica:</label>
            <select id="graphics-quality">
              <option value="high">Alta (Sombras + Anti-alias)</option>
              <option value="medium" selected>Media (Balanceada)</option>
              <option value="low">Baja (TV / Rendimiento)</option>
            </select>
          </div>

          <div class="setting-group">
            <label for="display-mode">Orientación / Modo TV:</label>
            <select id="display-mode">
              <option value="normal">Horizontal / Estándar</option>
              <option value="rotate-90">TV Vertical (90° Horario)</option>
              <option value="rotate-270">TV Vertical (270° Antihorario)</option>
            </select>
          </div>

          <button class="btn-apply" onclick="closeSettingsModal()">Guardar y Cerrar</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "118308";
    let scene, camera, renderer, playerCar, audioListener, compressorNode;
    let currentSettings = { volume: 100, graphics: 'medium', display: 'normal' };

    function init() {
      const container = document.getElementById('game-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030408);

      // Cámara del juego 3D
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2.5, 6);
      camera.lookAt(0, 0.5, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Iluminación
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(5, 10, 5);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Malla de referencia para la pista
      const gridHelper = new THREE.GridHelper(100, 50, 0x00f0ff, 0x1b2033);
      scene.add(gridHelper);

      // Carga del Vehículo 3D
      const loader = new THREE.GLTFLoader();
      loader.load('player_car.glb', function (gltf) {
        playerCar = gltf.scene;
        playerCar.position.set(0, 0, 0);
        scene.add(playerCar);
      }, undefined, function (error) {
        console.error('Error cargando player_car.glb:', error);
      });

      // Sistema de Audio Potenciado con Compresor Dinámico
      audioListener = new THREE.AudioListener();
      camera.add(audioListener);

      const audioCtx = audioListener.context;
      compressorNode = audioCtx.createDynamicsCompressor();
      compressorNode.threshold.setValueAtTime(-24, audioCtx.currentTime);
      compressorNode.knee.setValueAtTime(30, audioCtx.currentTime);
      compressorNode.ratio.setValueAtTime(12, audioCtx.currentTime);
      compressorNode.attack.setValueAtTime(0.003, audioCtx.currentTime);
      compressorNode.release.setValueAtTime(0.25, audioCtx.currentTime);

      audioListener.getInput().connect(compressorNode);
      compressorNode.connect(audioCtx.destination);

      loadStoredSettings();

      window.addEventListener('resize', onWindowResize);
      setupSettingsEvents();

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (playerCar) {
        playerCar.rotation.y += 0.005;
      }
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('game-container');
      const isRotated = container.classList.contains('rotate-90') || container.classList.contains('rotate-270');
      const width = isRotated ? window.innerHeight : window.innerWidth;
      const height = isRotated ? window.innerWidth : window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    /* Lógica de Autenticación y Modal */
    function openSettingsModal() {
      document.getElementById('settings-modal').style.display = 'flex';
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('controls-section').style.display = 'none';
      document.getElementById('admin-pass').value = '';
      document.getElementById('auth-error').style.display = 'none';

      if (audioListener && audioListener.context.state === 'suspended') {
        audioListener.context.resume();
      }
    }

    function validatePassword() {
      const inputPass = document.getElementById('admin-pass').value;
      const errorMsg = document.getElementById('auth-error');

      if (inputPass === ADMIN_PASS) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('controls-section').style.display = 'block';
        errorMsg.style.display = 'none';
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('admin-pass').value = '';
      }
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    /* Eventos y Persistencia */
    function setupSettingsEvents() {
      const volInput = document.getElementById('master-volume');
      const volVal = document.getElementById('vol-val');
      const graphicsSelect = document.getElementById('graphics-quality');
      const displaySelect = document.getElementById('display-mode');

      volInput.addEventListener('input', (e) => {
        const val = e.target.value;
        volVal.textContent = val + '%';
        currentSettings.volume = val;
        applyVolume(val);
      });

      graphicsSelect.addEventListener('change', (e) => {
        currentSettings.graphics = e.target.value;
        applyGraphics(e.target.value);
      });

      displaySelect.addEventListener('change', (e) => {
        currentSettings.display = e.target.value;
        applyDisplay(e.target.value);
      });

      // Permitir presionar Enter en la contraseña
      document.getElementById('admin-pass').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') validatePassword();
      });
    }

    function applyVolume(value) {
      if (audioListener) {
        audioListener.setMasterVolume(value / 100);
      }
      saveSettings();
    }

    function applyGraphics(quality) {
      if (quality === 'low') {
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = false;
      } else if (quality === 'medium') {
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
      } else if (quality === 'high') {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
      }
      saveSettings();
    }

    function applyDisplay(mode) {
      const container = document.getElementById('game-container');
      container.classList.remove('rotate-90', 'rotate-270');

      if (mode === 'rotate-90') container.classList.add('rotate-90');
      if (mode === 'rotate-270') container.classList.add('rotate-270');

      setTimeout(onWindowResize, 50);
      saveSettings();
    }

    function saveSettings() {
      localStorage.setItem('gnc_game_settings', JSON.stringify(currentSettings));
    }

    function loadStoredSettings() {
      const stored = localStorage.getItem('gnc_game_settings');
      if (stored) {
        currentSettings = JSON.parse(stored);
        document.getElementById('master-volume').value = currentSettings.volume;
        document.getElementById('vol-val').textContent = currentSettings.volume + '%';
        document.getElementById('graphics-quality').value = currentSettings.graphics;
        document.getElementById('display-mode').value = currentSettings.display;

        applyVolume(currentSettings.volume);
        applyGraphics(currentSettings.graphics);
        applyDisplay(currentSettings.display);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
