<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GNC TURBO RACER 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background-color: #030408; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            touch-action: none;
        }

        #ui-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            width: 92%;
            max-width: 450px;
            justify-content: center;
        }

        .ui-box {
            background: rgba(10, 12, 24, 0.85);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 6px 10px;
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            text-align: center;
            flex: 1;
        }

        .diff-tag {
            color: #ffcc00;
            display: block;
            font-size: 11px;
        }

        #controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            pointer-events: none;
        }

        .btn-group { 
            display: flex; 
            gap: 12px; 
            pointer-events: auto;
        }

        .control-btn {
            width: 58px;
            height: 58px;
            background: rgba(0, 210, 255, 0.15);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
            cursor: pointer;
        }

        .control-btn:active {
            background: rgba(0, 210, 255, 0.5);
            transform: scale(0.92);
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(3, 4, 8, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }

        #game-over-screen h1 {
            font-size: 36px;
            color: #ff3355;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 51, 85, 0.8);
        }

        #restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="ui-box">
            ETAPA: <span id="stage-val">1</span>
            <span id="diff-val" class="diff-tag">FÁCIL</span>
        </div>
        <div class="ui-box">PTS: <span id="score-val">0</span></div>
        <div class="ui-box">VIDAS: <span id="lives-val">❤️❤️❤️</span></div>
    </div>

    <div id="controls-container">
        <div class="btn-group">
            <div class="control-btn" id="btn-left">❮</div>
            <div class="control-btn" id="btn-right">❯</div>
        </div>
        <div class="btn-group">
            <div class="control-btn" id="btn-brake">🛑</div>
            <div class="control-btn" id="btn-boost">⚡</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>¡GAME OVER!</h1>
        <p id="final-score" style="font-size: 18px;">Puntuación Final: 0</p>
        <button id="restart-btn" onclick="resetGame()">REINTENTAR</button>
    </div>

    <script>
        // --- AUDIO ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBrakeSound(duration = 0.4) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(350, now + duration);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.Q.setValueAtTime(4, now);

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.01, now);
            masterGain.gain.linearRampToValueAtTime(0.2, now + 0.04);
            masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(filter);
            filter.connect(masterGain);
            masterGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration);
        }

        // --- ESCENA Y NIEBLA ---
        const scene = new THREE.Scene();
        const dayColor = new THREE.Color(0xa0c4ff);
        const sunsetColor = new THREE.Color(0xff7b00);
        const nightColor = new THREE.Color(0x050711);

        scene.background = dayColor.clone();
        scene.fog = new THREE.FogExp2(dayColor.clone(), 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- ILUMINACIÓN DÍA / NOCHE ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(20, 40, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        // --- PISTA ---
        const roadGeo = new THREE.PlaneGeometry(12, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.6 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -450;
        road.receiveShadow = true;
        scene.add(road);

        const lineGeo = new THREE.PlaneGeometry(0.2, 1000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
        const leftLine = new THREE.Mesh(lineGeo, lineMat);
        leftLine.rotation.x = -Math.PI / 2;
        leftLine.position.set(-5.9, 0.02, -450);
        scene.add(leftLine);

        const rightLine = leftLine.clone();
        rightLine.position.x = 5.9;
        scene.add(rightLine);

        // --- AUTO ---
        const playerGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0088ff, metalness: 0.8, roughness: 0.2 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.9, roughness: 0.05 });
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.4, 2.6), bodyMat);
        body.position.y = 0.35;
        body.castShadow = true;
        playerGroup.add(body);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.38, 1.2), glassMat);
        cabin.position.set(0, 0.7, -0.1);
        cabin.castShadow = true;
        playerGroup.add(cabin);

        const wing = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.3), bodyMat);
        wing.position.set(0, 0.85, 1.1);
        wing.castShadow = true;
        playerGroup.add(wing);

        const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.22, 20);
        wheelGeo.rotateZ(Math.PI / 2);
        [[-0.75, 0.3, 0.8], [0.75, 0.3, 0.8], [-0.75, 0.3, -0.8], [0.75, 0.3, -0.8]].forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.position.set(...pos);
            w.castShadow = true;
            playerGroup.add(w);
        });

        const headlightL = new THREE.SpotLight(0xffffff, 0, 25, Math.PI / 6, 0.5);
        headlightL.position.set(-0.5, 0.4, -1.3);
        headlightL.target.position.set(-0.5, 0, -10);
        playerGroup.add(headlightL);
        playerGroup.add(headlightL.target);

        const headlightR = headlightL.clone();
        headlightR.position.x = 0.5;
        headlightR.target.position.x = 0.5;
        playerGroup.add(headlightR);
        playerGroup.add(headlightR.target);

        scene.add(playerGroup);
        playerGroup.add(camera);

        function updateCameraFOV() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) {
                camera.fov = 75;
                camera.position.set(0, 4.2, 6.5);
            } else {
                camera.fov = 55;
                camera.position.set(0, 3.2, 5.5);
            }
            camera.lookAt(0, 0.4, -5);
            camera.updateProjectionMatrix();
        }
        updateCameraFOV();

        // --- MODELADO MEJORADO DE PEATONES 3D ---
        function createPedestrian() {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.7 });
            const clothesMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.5 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1a202c, roughness: 0.8 });

            // Torso
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 0.65, 12), clothesMat);
            torso.position.y = 0.75;
            torso.castShadow = true;
            group.add(torso);

            // Cabeza
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), skinMat);
            head.position.y = 1.2;
            head.castShadow = true;
            group.add(head);

            // Brazos
            const armGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.5);
            const leftArm = new THREE.Mesh(armGeo, clothesMat);
            leftArm.position.set(-0.25, 0.75, 0);
            leftArm.castShadow = true;
            group.add(leftArm);

            const rightArm = leftArm.clone();
            rightArm.position.x = 0.25;
            group.add(rightArm);

            // Piernas
            const legGeo = new THREE.CylinderGeometry(0.07, 0.06, 0.55);
            const leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.1, 0.28, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.1;
            group.add(rightLeg);

            group.userData = {
                type: 'pedestrian',
                leftLeg, rightLeg, leftArm, rightArm,
                direction: Math.random() > 0.5 ? 1 : -1,
                walkSpeed: 0.035 + Math.random() * 0.02,
                animTimer: Math.random() * 10
            };

            group.rotation.y = group.userData.direction === 1 ? Math.PI / 2 : -Math.PI / 2;
            return group;
        }

        // --- FABRICA DE OBSTÁCULOS Y ENTIDADES ---
        function createCone() {
            const group = new THREE.Group();
            const cone = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.9, 16), new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.3 }));
            cone.position.y = 0.45;
            cone.castShadow = true;
            group.add(cone);

            const band = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.26, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            band.position.y = 0.45;
            group.add(band);
            return group;
        }

        function createMotorcycle() {
            const group = new THREE.Group();
            const mBody = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xcc0022, metalness: 0.6 }));
            mBody.position.y = 0.4;
            mBody.castShadow = true;
            group.add(mBody);

            const driver = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            driver.position.set(0, 0.8, -0.1);
            driver.castShadow = true;
            group.add(driver);

            group.userData = { type: 'motorcycle', direction: Math.random() > 0.5 ? 1 : -1 };
            return group;
        }

        function createBlock() {
            const block = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.8, 1.0), new THREE.MeshStandardMaterial({ color: 0x777788, roughness: 0.9 }));
            block.position.y = 0.4;
            block.castShadow = true;
            return block;
        }

        // --- ESTADO DE DIFICULTAD Y CICLO DÍA/NOCHE ---
        let currentLane = 0;
        const lanePositions = [-3.6, 0, 3.6];
        let score = 0, stage = 1, lives = 3;
        let baseSpeed = 0.45, currentSpeed = baseSpeed;
        let spawnInterval = 1.3;
        let isGameOver = false;

        const obstacles = [];
        const collectibles = [];

        function updateDifficultyAndLighting() {
            // Cambio de Etapa y Dificultad
            let diffText = "FÁCIL";
            if (score < 100) {
                stage = 1;
                diffText = "FÁCIL";
                baseSpeed = 0.45;
                spawnInterval = 1.2;
            } else if (score < 250) {
                stage = 2;
                diffText = "MEDIO";
                baseSpeed = 0.6;
                spawnInterval = 0.95;
            } else {
                stage = 3;
                diffText = "DIFÍCIL";
                baseSpeed = 0.75;
                spawnInterval = 0.7;
            }

            // Transición Progresiva Día -> Atardecer -> Noche
            const targetColor = new THREE.Color();
            let sunIntensity = 1.2;
            let headlightIntensity = 0;

            if (score < 100) {
                // Día
                targetColor.copy(dayColor);
                sunIntensity = 1.2;
                headlightIntensity = 0;
            } else if (score < 250) {
                // Atardecer (Transición)
                const t = (score - 100) / 150;
                targetColor.lerpColors(dayColor, sunsetColor, t);
                sunIntensity = 1.2 - (0.6 * t);
                headlightIntensity = t * 1.5;
            } else {
                // Noche
                const t = Math.min(1, (score - 250) / 200);
                targetColor.lerpColors(sunsetColor, nightColor, t);
                sunIntensity = 0.6 - (0.45 * t);
                headlightIntensity = 1.5 + (1.5 * t);
            }

            scene.background.lerp(targetColor, 0.05);
            scene.fog.color.lerp(targetColor, 0.05);
            sun.intensity = THREE.MathUtils.lerp(sun.intensity, sunIntensity, 0.05);
            ambientLight.intensity = THREE.MathUtils.lerp(ambientLight.intensity, sunIntensity * 0.5, 0.05);
            headlightL.intensity = THREE.MathUtils.lerp(headlightL.intensity, headlightIntensity, 0.05);
            headlightR.intensity = THREE.MathUtils.lerp(headlightR.intensity, headlightIntensity, 0.05);

            document.getElementById('stage-val').innerText = stage;
            document.getElementById('diff-val').innerText = diffText;
        }

        // --- CONTROLES ---
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > -1) currentLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 1) currentLane++;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') currentSpeed = baseSpeed * 1.6;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                currentSpeed = baseSpeed * 0.45;
                playBrakeSound(0.4);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'w', 'W', 'ArrowDown', 's', 'S'].includes(e.key)) currentSpeed = baseSpeed;
        });

        const bindBtn = (id, actionDown, actionUp) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionDown(); }, { passive: false });
            btn.addEventListener('mousedown', actionDown);
            if (actionUp) {
                btn.addEventListener('touchend', (e) => { e.preventDefault(); actionUp(); }, { passive: false });
                btn.addEventListener('mouseup', actionUp);
            }
        };

        bindBtn('btn-left', () => { if (!isGameOver && currentLane > -1) currentLane--; });
        bindBtn('btn-right', () => { if (!isGameOver && currentLane < 1) currentLane++; });
        bindBtn('btn-boost', () => { if (!isGameOver) currentSpeed = baseSpeed * 1.6; }, () => { currentSpeed = baseSpeed; });
        bindBtn('btn-brake', () => { 
            if (!isGameOver) { 
                currentSpeed = baseSpeed * 0.45; 
                playBrakeSound(0.4);
            } 
        }, () => { currentSpeed = baseSpeed; });

        // --- SPANWING DE ENTIDADES SEGÚN DIFICULTAD ---
        function spawnObstacle() {
            if (isGameOver) return;
            const rand = Math.random();
            let obs;

            if (stage === 1) { // Fácil: conos y bloques
                obs = rand < 0.6 ? createCone() : createBlock();
            } else if (stage === 2) { // Medio: conos, bloques y peatones
                if (rand < 0.4) obs = createCone();
                else if (rand < 0.7) obs = createBlock();
                else obs = createPedestrian();
            } else { // Difícil: incluye motos que cruzan
                if (rand < 0.3) obs = createCone();
                else if (rand < 0.55) obs = createBlock();
                else if (rand < 0.8) obs = createPedestrian();
                else obs = createMotorcycle();
            }

            const lane = Math.floor(Math.random() * 3) - 1;
            const posX = (obs.userData && obs.userData.type === 'pedestrian') ? (obs.userData.direction === 1 ? -6.5 : 6.5) : lanePositions[lane + 1];
            obs.position.set(posX, 0, -80);
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnCollectible() {
            if (isGameOver) return;
            const item = new THREE.Mesh(new THREE.OctahedronGeometry(0.45), new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.1 }));
            item.position.y = 0.6;
            item.castShadow = true;

            const lane = Math.floor(Math.random() * 3) - 1;
            item.position.set(lanePositions[lane + 1], 0.6, -80);
            scene.add(item);
            collectibles.push(item);
        }

        let spawnTimer = 0;

        // --- BUCLE PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                updateDifficultyAndLighting();

                const targetX = lanePositions[currentLane + 1];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;

                spawnTimer += 0.016;
                if (spawnTimer > spawnInterval) {
                    spawnTimer = 0;
                    if (Math.random() > 0.25) spawnObstacle();
                    if (Math.random() > 0.35) spawnCollectible();
                }

                // Obstáculos y Peatones
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += currentSpeed;

                    // Comportamiento de Peatón (Cruce lateral + Animación)
                    if (obs.userData && obs.userData.type === 'pedestrian') {
                        obs.position.x += obs.userData.walkSpeed * obs.userData.direction;
                        obs.userData.animTimer += 0.15;
                        const angle = Math.sin(obs.userData.animTimer) * 0.45;
                        obs.userData.leftLeg.rotation.x = angle;
                        obs.userData.rightLeg.rotation.x = -angle;
                        obs.userData.leftArm.rotation.x = -angle;
                        obs.userData.rightArm.rotation.x = angle;
                    }

                    // Comportamiento de Moto
                    if (obs.userData && obs.userData.type === 'motorcycle') {
                        obs.position.x += 0.035 * obs.userData.direction;
                        if (Math.abs(obs.position.x) > 5) obs.userData.direction *= -1;
                    }

                    // Colisión
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 1.1 &&
                        Math.abs(obs.position.x - playerGroup.position.x) < 0.85) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        lives--;
                        updateUI();
                        if (lives <= 0) triggerGameOver();
                        continue;
                    }

                    if (obs.position.z > 6 || Math.abs(obs.position.x) > 8) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Coleccionables
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const item = collectibles[i];
                    item.position.z += currentSpeed;
                    item.rotation.y += 0.04;

                    if (Math.abs(item.position.z - playerGroup.position.z) < 1.1 &&
                        Math.abs(item.position.x - playerGroup.position.x) < 0.85) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                        score += 15;
                        updateUI();
                        continue;
                    }

                    if (item.position.z > 6) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function updateUI() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('lives-val').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Puntuación Final: ${score}`;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            collectibles.forEach(item => scene.remove(item));
            obstacles.length = 0;
            collectibles.length = 0;

            score = 0;
            stage = 1;
            lives = 3;
            baseSpeed = 0.45;
            currentSpeed = baseSpeed;
            currentLane = 0;
            isGameOver = false;

            playerGroup.position.set(0, 0, 0);
            updateUI();
            document.getElementById('game-over-screen').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            updateCameraFOV();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
