<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GNC TURBO RACER 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background-color: #030408; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            touch-action: none;
        }

        #ui-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            width: 90%;
            max-width: 400px;
            justify-content: center;
        }

        .ui-box {
            background: rgba(10, 12, 24, 0.85);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 6px 12px;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            text-align: center;
            flex: 1;
        }

        #controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            pointer-events: none;
        }

        .btn-group { 
            display: flex; 
            gap: 12px; 
            pointer-events: auto;
        }

        .control-btn {
            width: 58px;
            height: 58px;
            background: rgba(0, 210, 255, 0.15);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
            cursor: pointer;
        }

        .control-btn:active {
            background: rgba(0, 210, 255, 0.5);
            transform: scale(0.92);
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(3, 4, 8, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }

        #game-over-screen h1 {
            font-size: 36px;
            color: #ff3355;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 51, 85, 0.8);
        }

        #restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="ui-box">NIVEL: <span id="level-val">1</span></div>
        <div class="ui-box">PTS: <span id="score-val">0</span></div>
        <div class="ui-box">VIDAS: <span id="lives-val">❤️❤️❤️</span></div>
    </div>

    <div id="controls-container">
        <div class="btn-group">
            <div class="control-btn" id="btn-left">❮</div>
            <div class="control-btn" id="btn-right">❯</div>
        </div>
        <div class="btn-group">
            <div class="control-btn" id="btn-brake">🛑</div>
            <div class="control-btn" id="btn-boost">⚡</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>¡GAME OVER!</h1>
        <p id="final-score" style="font-size: 18px;">Puntuación Final: 0</p>
        <button id="restart-btn" onclick="resetGame()">REINTENTAR</button>
    </div>

    <script>
        // --- ESCENA Y NIEBLA RETRO ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050711);
        scene.fog = new THREE.FogExp2(0x050711, 0.015);

        // --- CÁMARA CON ADAPTABILIDAD MÓVIL (FOV AJUSTABLE) ---
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- ILUMINACIÓN REALISTA Y FAROS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffd2a0, 1.0);
        sun.position.set(20, 40, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        // --- PISTA Y ENTORNO ---
        const roadGeo = new THREE.PlaneGeometry(12, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x121318, roughness: 0.6, metalness: 0.1 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -450;
        road.receiveShadow = true;
        scene.add(road);

        // Delimitadores fluorescentes
        const lineGeo = new THREE.PlaneGeometry(0.2, 1000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
        
        const leftLine = new THREE.Mesh(lineGeo, lineMat);
        leftLine.rotation.x = -Math.PI / 2;
        leftLine.position.set(-5.9, 0.02, -450);
        scene.add(leftLine);

        const rightLine = leftLine.clone();
        rightLine.position.x = 5.9;
        scene.add(rightLine);

        // --- CONSTRUCCIÓN DETALLADA DEL AUTO ---
        const playerGroup = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0088ff, metalness: 0.8, roughness: 0.2 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.9, roughness: 0.05 });
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

        // Chasis
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.4, 2.6), bodyMat);
        body.position.y = 0.35;
        body.castShadow = true;
        playerGroup.add(body);

        // Cabina
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.38, 1.2), glassMat);
        cabin.position.set(0, 0.7, -0.1);
        cabin.castShadow = true;
        playerGroup.add(cabin);

        // Alerón
        const wing = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.3), bodyMat);
        wing.position.set(0, 0.85, 1.1);
        wing.castShadow = true;
        playerGroup.add(wing);

        // Ruedas 3D
        const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.22, 20);
        wheelGeo.rotateZ(Math.PI / 2);

        [[-0.75, 0.3, 0.8], [0.75, 0.3, 0.8], [-0.75, 0.3, -0.8], [0.75, 0.3, -0.8]].forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.position.set(...pos);
            w.castShadow = true;
            playerGroup.add(w);
        });

        // Faros delanteros proyectores de luz
        const headlightL = new THREE.SpotLight(0xffffff, 2, 25, Math.PI / 6, 0.5);
        headlightL.position.set(-0.5, 0.4, -1.3);
        headlightL.target.position.set(-0.5, 0, -10);
        playerGroup.add(headlightL);
        playerGroup.add(headlightL.target);

        const headlightR = headlightL.clone();
        headlightR.position.x = 0.5;
        headlightR.target.position.x = 0.5;
        playerGroup.add(headlightR);
        playerGroup.add(headlightR.target);

        scene.add(playerGroup);

        // Posición de cámara ajustada
        playerGroup.add(camera);

        function updateCameraFOV() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) { // Pantallas verticales de celulares
                camera.fov = 75;
                camera.position.set(0, 4.2, 6.5);
            } else { // Computadoras / Pantallas anchas
                camera.fov = 55;
                camera.position.set(0, 3.2, 5.5);
            }
            camera.lookAt(0, 0.4, -5);
            camera.updateProjectionMatrix();
        }
        updateCameraFOV();

        // --- FABRICA DE DIVERSIDAD DE OBSTÁCULOS ---

        // 1. Cono de Tránsito
        function createCone() {
            const group = new THREE.Group();
            const coneGeo = new THREE.ConeGeometry(0.35, 0.9, 16);
            const coneMat = new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.3 });
            const cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.y = 0.45;
            cone.castShadow = true;
            group.add(cone);

            const bandGeo = new THREE.CylinderGeometry(0.2, 0.26, 0.2, 16);
            const bandMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
            const band = new THREE.Mesh(bandGeo, bandMat);
            band.position.y = 0.45;
            group.add(band);
            return group;
        }

        // 2. Motociclista / Moto
        function createMotorcycle() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0022, metalness: 0.6 });
            
            // Chasis moto
            const mBody = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.4), bodyMat);
            mBody.position.y = 0.4;
            mBody.castShadow = true;
            group.add(mBody);

            // Conductor
            const driverGeo = new THREE.SphereGeometry(0.25, 12, 12);
            const driverMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const driver = new THREE.Mesh(driverGeo, driverMat);
            driver.position.set(0, 0.8, -0.1);
            driver.castShadow = true;
            group.add(driver);

            group.userData = { type: 'motorcycle', direction: Math.random() > 0.5 ? 1 : -1 };
            return group;
        }

        // 3. Bloque de Concreto
        function createBlock() {
            const blockGeo = new THREE.BoxGeometry(1.3, 0.8, 1.0);
            const blockMat = new THREE.MeshStandardMaterial({ color: 0x777788, roughness: 0.9 });
            const block = new THREE.Mesh(blockGeo, blockMat);
            block.position.y = 0.4;
            block.castShadow = true;
            return block;
        }

        // --- ESTADO Y CONTROLES ---
        let currentLane = 0;
        const lanePositions = [-3.6, 0, 3.6];
        let score = 0, level = 1, lives = 3;
        let baseSpeed = 0.5, currentSpeed = baseSpeed;
        let isGameOver = false;

        const obstacles = [];
        const collectibles = [];

        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > -1) currentLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 1) currentLane++;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') currentSpeed = baseSpeed * 1.7;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') currentSpeed = baseSpeed * 0.5;
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'w', 'W', 'ArrowDown', 's', 'S'].includes(e.key)) currentSpeed = baseSpeed;
        });

        const bindBtn = (id, actionDown, actionUp) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionDown(); }, { passive: false });
            btn.addEventListener('mousedown', actionDown);
            if (actionUp) {
                btn.addEventListener('touchend', (e) => { e.preventDefault(); actionUp(); }, { passive: false });
                btn.addEventListener('mouseup', actionUp);
            }
        };

        bindBtn('btn-left', () => { if (!isGameOver && currentLane > -1) currentLane--; });
        bindBtn('btn-right', () => { if (!isGameOver && currentLane < 1) currentLane++; });
        bindBtn('btn-boost', () => { if (!isGameOver) currentSpeed = baseSpeed * 1.7; }, () => { currentSpeed = baseSpeed; });
        bindBtn('btn-brake', () => { if (!isGameOver) currentSpeed = baseSpeed * 0.5; }, () => { currentSpeed = baseSpeed; });

        // --- SPINNER DE DIFICULTAD ---
        function spawnObstacle() {
            if (isGameOver) return;
            const rand = Math.random();
            let obs;

            if (rand < 0.4) {
                obs = createCone();
            } else if (rand < 0.75) {
                obs = createMotorcycle();
            } else {
                obs = createBlock();
            }

            const lane = Math.floor(Math.random() * 3) - 1;
            obs.position.set(lanePositions[lane + 1], 0, -80);
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnCollectible() {
            if (isGameOver) return;
            const itemMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.1 });
            const item = new THREE.Mesh(new THREE.OctahedronGeometry(0.45), itemMat);
            item.position.y = 0.6;
            item.castShadow = true;

            const lane = Math.floor(Math.random() * 3) - 1;
            item.position.set(lanePositions[lane + 1], 0.6, -80);
            scene.add(item);
            collectibles.push(item);
        }

        let spawnTimer = 0;

        // --- BUCLE PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                // Posicionamiento lateral
                const targetX = lanePositions[currentLane + 1];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;

                // Spawning
                spawnTimer += 0.016;
                if (spawnTimer > 1.0) {
                    spawnTimer = 0;
                    if (Math.random() > 0.3) spawnObstacle();
                    if (Math.random() > 0.35) spawnCollectible();
                }

                // Manejo de Obstáculos
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += currentSpeed;

                    // Si es moto, realiza desplazamiento cruzado lateral
                    if (obs.userData && obs.userData.type === 'motorcycle') {
                        obs.position.x += 0.03 * obs.userData.direction;
                        if (Math.abs(obs.position.x) > 5) obs.userData.direction *= -1;
                    }

                    // Detección de Colisión
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 1.1 &&
                        Math.abs(obs.position.x - playerGroup.position.x) < 0.85) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        lives--;
                        updateUI();
                        if (lives <= 0) triggerGameOver();
                        continue;
                    }

                    if (obs.position.z > 6) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Manejo de Coleccionables
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const item = collectibles[i];
                    item.position.z += currentSpeed;
                    item.rotation.y += 0.04;

                    if (Math.abs(item.position.z - playerGroup.position.z) < 1.1 &&
                        Math.abs(item.position.x - playerGroup.position.x) < 0.85) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                        score += 10;
                        if (score >= level * 100) {
                            level++;
                            baseSpeed += 0.04;
                        }
                        updateUI();
                        continue;
                    }

                    if (item.position.z > 6) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function updateUI() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('level-val').innerText = level;
            document.getElementById('lives-val').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Puntuación Final: ${score}`;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            collectibles.forEach(item => scene.remove(item));
            obstacles.length = 0;
            collectibles.length = 0;

            score = 0;
            level = 1;
            lives = 3;
            baseSpeed = 0.5;
            currentSpeed = baseSpeed;
            currentLane = 0;
            isGameOver = false;

            playerGroup.position.set(0, 0, 0);
            updateUI();
            document.getElementById('game-over-screen').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            updateCameraFOV();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
