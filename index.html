<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GNC TURBO RACER 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background-color: #030408; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            touch-action: none;
        }

        #ui-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            width: 92%;
            max-width: 450px;
            justify-content: center;
        }

        .ui-box {
            background: rgba(10, 12, 24, 0.85);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 6px 10px;
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            text-align: center;
            flex: 1;
        }

        .diff-tag {
            color: #ffcc00;
            display: block;
            font-size: 11px;
        }

        #controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            pointer-events: none;
        }

        .btn-group { 
            display: flex; 
            gap: 12px; 
            pointer-events: auto;
        }

        .control-btn {
            width: 58px;
            height: 58px;
            background: rgba(0, 210, 255, 0.15);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
            cursor: pointer;
        }

        .control-btn:active {
            background: rgba(0, 210, 255, 0.5);
            transform: scale(0.92);
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(3, 4, 8, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }

        #game-over-screen h1 {
            font-size: 36px;
            color: #ff3355;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 51, 85, 0.8);
        }

        #restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="ui-box">
            ETAPA: <span id="stage-val">1</span>
            <span id="diff-val" class="diff-tag">FÁCIL</span>
        </div>
        <div class="ui-box">PTS: <span id="score-val">0</span></div>
        <div class="ui-box">VIDAS: <span id="lives-val">❤️❤️❤️</span></div>
    </div>

    <div id="controls-container">
        <div class="btn-group">
            <div class="control-btn" id="btn-left">❮</div>
            <div class="control-btn" id="btn-right">❯</div>
        </div>
        <div class="btn-group">
            <div class="control-btn" id="btn-brake">🛑</div>
            <div class="control-btn" id="btn-boost">⚡</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>¡GAME OVER!</h1>
        <p id="final-score" style="font-size: 18px;">Puntuación Final: 0</p>
        <button id="restart-btn" onclick="resetGame()">REINTENTAR</button>
    </div>

    <script>
        // --- CANVASES Y TEXTURAS ---
        function createTextTexture(text, bgColor = '#ffcc00', textColor = '#000000') {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 8;
            ctx.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);

            ctx.fillStyle = textColor;
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const lines = text.split('\n');
            if (lines.length === 1) {
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            } else {
                ctx.fillText(lines[0], canvas.width / 2, canvas.height / 2 - 18);
                ctx.fillText(lines[1], canvas.width / 2, canvas.height / 2 + 18);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const extraGncTexture = createTextTexture('EXTRA GNC', '#ffcc00', '#000000');
        const signAnimalTexture = createTextTexture('PRECAUCIÓN\nANIMALES', '#f1c40f', '#000000');
        const signPedestrianTexture = createTextTexture('PRECAUCIÓN\nPEATONES', '#f1c40f', '#000000');

        // --- AUDIO ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBrakeSound(duration = 0.4) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(350, now + duration);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.Q.setValueAtTime(4, now);

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.01, now);
            masterGain.gain.linearRampToValueAtTime(0.2, now + 0.04);
            masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(filter);
            filter.connect(masterGain);
            masterGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration);
        }

        // --- ESCENA Y CÁMARA ---
        const scene = new THREE.Scene();
        const dayColor = new THREE.Color(0xa0c4ff);
        const sunsetColor = new THREE.Color(0xff7b00);
        const nightColor = new THREE.Color(0x050711);

        scene.background = dayColor.clone();
        scene.fog = new THREE.FogExp2(dayColor.clone(), 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(30, 50, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        // --- PAISAJE Y ENTORNO ---
        // Terreno Lateral (Pastizal / Desierto)
        const terrainMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.9 });
        const terrainGeo = new THREE.PlaneGeometry(300, 1000);
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.rotation.x = -Math.PI / 2;
        terrain.position.set(0, -0.05, -450);
        terrain.receiveShadow = true;
        scene.add(terrain);

        // Pista / Ruta
        const roadGeo = new THREE.PlaneGeometry(12, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.6 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -450;
        road.receiveShadow = true;
        scene.add(road);

        const lineGeo = new THREE.PlaneGeometry(0.2, 1000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
        const leftLine = new THREE.Mesh(lineGeo, lineMat);
        leftLine.rotation.x = -Math.PI / 2;
        leftLine.position.set(-5.9, 0.02, -450);
        scene.add(leftLine);

        const rightLine = leftLine.clone();
        rightLine.position.x = 5.9;
        scene.add(rightLine);

        // Montañas del Horizonte
        const mountainsGroup = new THREE.Group();
        const mountainMat = new THREE.MeshStandardMaterial({ color: 0x1f3a52, roughness: 1.0 });
        for (let i = -5; i <= 5; i++) {
            const m = new THREE.Mesh(new THREE.ConeGeometry(30 + Math.random() * 20, 40 + Math.random() * 30, 5), mountainMat);
            m.position.set(i * 35, 15, -350);
            mountainsGroup.add(m);
        }
        scene.add(mountainsGroup);

        // --- MODELADO DEL AUTO "EXTRA GNC" ---
        const playerGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0088ff, metalness: 0.8, roughness: 0.2 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.9, roughness: 0.05 });
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.4, 2.6), bodyMat);
        body.position.y = 0.35;
        body.castShadow = true;
        playerGroup.add(body);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.38, 1.2), glassMat);
        cabin.position.set(0, 0.7, -0.1);
        cabin.castShadow = true;
        playerGroup.add(cabin);

        const signGeo = new THREE.BoxGeometry(0.8, 0.25, 0.15);
        const signMat = new THREE.MeshStandardMaterial({ map: extraGncTexture, roughness: 0.3 });
        const sign = new THREE.Mesh(signGeo, signMat);
        sign.position.set(0, 0.98, -0.1);
        sign.castShadow = true;
        playerGroup.add(sign);

        const wing = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.3), bodyMat);
        wing.position.set(0, 0.85, 1.1);
        wing.castShadow = true;
        playerGroup.add(wing);

        const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.22, 20);
        wheelGeo.rotateZ(Math.PI / 2);
        [[-0.75, 0.3, 0.8], [0.75, 0.3, 0.8], [-0.75, 0.3, -0.8], [0.75, 0.3, -0.8]].forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.position.set(...pos);
            w.castShadow = true;
            playerGroup.add(w);
        });

        const headlightL = new THREE.SpotLight(0xffffff, 0, 25, Math.PI / 6, 0.5);
        headlightL.position.set(-0.5, 0.4, -1.3);
        headlightL.target.position.set(-0.5, 0, -10);
        playerGroup.add(headlightL);
        playerGroup.add(headlightL.target);

        const headlightR = headlightL.clone();
        headlightR.position.x = 0.5;
        headlightR.target.position.x = 0.5;
        playerGroup.add(headlightR);
        playerGroup.add(headlightR.target);

        scene.add(playerGroup);
        playerGroup.add(camera);

        function updateCameraFOV() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) {
                camera.fov = 75;
                camera.position.set(0, 4.2, 6.5);
            } else {
                camera.fov = 55;
                camera.position.set(0, 3.2, 5.5);
            }
            camera.lookAt(0, 0.4, -5);
            camera.updateProjectionMatrix();
        }
        updateCameraFOV();

        // --- ENTIDADES 3D: ARBOLES, PEATONES, ANIMALES, SEÑALES ---
        function createTree() {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.9 });
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1e5631, roughness: 0.6 });

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 2), trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            group.add(trunk);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3.5, 8), leavesMat);
            leaves.position.y = 3;
            leaves.castShadow = true;
            group.add(leaves);

            group.userData = { type: 'scenery' };
            return group;
        }

        function createPedestrian() {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.7 });
            const clothesMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.5 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1a202c, roughness: 0.8 });

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 0.65, 12), clothesMat);
            torso.position.y = 0.75;
            torso.castShadow = true;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), skinMat);
            head.position.y = 1.2;
            head.castShadow = true;
            group.add(head);

            const armGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.5);
            const leftArm = new THREE.Mesh(armGeo, clothesMat);
            leftArm.position.set(-0.25, 0.75, 0);
            leftArm.castShadow = true;
            group.add(leftArm);

            const rightArm = leftArm.clone();
            rightArm.position.x = 0.25;
            group.add(rightArm);

            const legGeo = new THREE.CylinderGeometry(0.07, 0.06, 0.55);
            const leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.1, 0.28, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.1;
            group.add(rightLeg);

            group.userData = {
                type: 'pedestrian',
                leftLeg, rightLeg, leftArm, rightArm,
                direction: Math.random() > 0.5 ? 1 : -1,
                walkSpeed: 0.035 + Math.random() * 0.02,
                animTimer: Math.random() * 10
            };

            group.rotation.y = group.userData.direction === 1 ? Math.PI / 2 : -Math.PI / 2;
            return group;
        }

        function createAnimal() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
            const spotMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

            // Cuerpo Vaca
            const cBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 1.4), bodyMat);
            cBody.position.y = 0.65;
            cBody.castShadow = true;
            group.add(cBody);

            // Cabeza
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.45, 0.5), bodyMat);
            head.position.set(0, 0.9, -0.8);
            head.castShadow = true;
            group.add(head);

            // Patas
            const legGeo = new THREE.BoxGeometry(0.15, 0.4, 0.15);
            [[-0.3, 0.2, 0.4], [0.3, 0.2, 0.4], [-0.3, 0.2, -0.4], [0.3, 0.2, -0.4]].forEach(pos => {
                const leg = new THREE.Mesh(legGeo, spotMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                group.add(leg);
            });

            group.userData = {
                type: 'animal',
                direction: Math.random() > 0.5 ? 1 : -1,
                walkSpeed: 0.02 + Math.random() * 0.015
            };

            group.rotation.y = group.userData.direction === 1 ? Math.PI / 2 : -Math.PI / 2;
            return group;
        }

        function createTrafficSign(type) {
            const group = new THREE.Group();
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.5 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.5), poleMat);
            pole.position.y = 1.25;
            pole.castShadow = true;
            group.add(pole);

            const boardGeo = new THREE.BoxGeometry(0.9, 0.9, 0.05);
            const tex = type === 'animal' ? signAnimalTexture : signPedestrianTexture;
            const boardMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4 });
            const board = new THREE.Mesh(boardGeo, boardMat);
            board.position.set(0, 2.1, 0);
            board.rotation.z = Math.PI / 4; // Forma Diamante de advertencia
            board.castShadow = true;
            group.add(board);

            group.userData = { type: 'scenery' };
            return group;
        }

        function createCone() {
            const group = new THREE.Group();
            const cone = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.9, 16), new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.3 }));
            cone.position.y = 0.45;
            cone.castShadow = true;
            group.add(cone);

            const band = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.26, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            band.position.y = 0.45;
            group.add(band);
            return group;
        }

        function createBlock() {
            const block = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.8, 1.0), new THREE.MeshStandardMaterial({ color: 0x777788, roughness: 0.9 }));
            block.position.y = 0.4;
            block.castShadow = true;
            return block;
        }

        // --- ESTADO Y BIOMAS ALEATORIOS ---
        let currentLane = 0;
        const lanePositions = [-3.6, 0, 3.6];
        let score = 0, stage = 1, lives = 3;
        let baseSpeed = 0.45, currentSpeed = baseSpeed;
        let spawnInterval = 1.3;
        let isGameOver = false;

        const obstacles = [];
        const scenery = [];
        const collectibles = [];

        // Paletas de Biomas para dinamismo de ruta
        const biomes = [
            { terrain: 0x2e8b57, fog: 0xa0c4ff, name: "BOSQUE" },
            { terrain: 0xd2b48c, fog: 0xffdfa9, name: "DESIERTO" },
            { terrain: 0xe5e8e8, fog: 0xd6eaf8, name: "NIEVE" }
        ];
        let currentBiomeIndex = 0;

        function updateDifficultyAndEnvironment() {
            let diffText = "FÁCIL";
            if (score < 100) {
                stage = 1;
                diffText = "FÁCIL";
                baseSpeed = 0.45;
                spawnInterval = 1.2;
            } else if (score < 250) {
                stage = 2;
                diffText = "MEDIO";
                baseSpeed = 0.6;
                spawnInterval = 0.95;
            } else {
                stage = 3;
                diffText = "DIFÍCIL";
                baseSpeed = 0.75;
                spawnInterval = 0.7;
            }

            // Cambiar aleatoriamente de bioma/paisaje cada 120 puntos
            const biomeIdx = Math.floor(score / 120) % biomes.length;
            if (biomeIdx !== currentBiomeIndex) {
                currentBiomeIndex = biomeIdx;
                terrainMat.color.setHex(biomes[currentBiomeIndex].terrain);
            }

            // Transición Día/Noche
            const targetColor = new THREE.Color();
            let sunIntensity = 1.2;
            let headlightIntensity = 0;

            if (score < 100) {
                targetColor.copy(dayColor);
            } else if (score < 250) {
                const t = (score - 100) / 150;
                targetColor.lerpColors(dayColor, sunsetColor, t);
                sunIntensity = 1.2 - (0.6 * t);
                headlightIntensity = t * 1.5;
            } else {
                const t = Math.min(1, (score - 250) / 200);
                targetColor.lerpColors(sunsetColor, nightColor, t);
                sunIntensity = 0.15;
                headlightIntensity = 2.5;
            }

            scene.background.lerp(targetColor, 0.05);
            scene.fog.color.lerp(targetColor, 0.05);
            sun.intensity = THREE.MathUtils.lerp(sun.intensity, sunIntensity, 0.05);
            ambientLight.intensity = THREE.MathUtils.lerp(ambientLight.intensity, sunIntensity * 0.5, 0.05);
            headlightL.intensity = THREE.MathUtils.lerp(headlightL.intensity, headlightIntensity, 0.05);
            headlightR.intensity = THREE.MathUtils.lerp(headlightR.intensity, headlightIntensity, 0.05);

            document.getElementById('stage-val').innerText = stage;
            document.getElementById('diff-val').innerText = diffText;
        }

        // --- CONTROLES ---
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > -1) currentLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 1) currentLane++;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') currentSpeed = baseSpeed * 1.6;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                currentSpeed = baseSpeed * 0.45;
                playBrakeSound(0.4);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'w', 'W', 'ArrowDown', 's', 'S'].includes(e.key)) currentSpeed = baseSpeed;
        });

        const bindBtn = (id, actionDown, actionUp) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionDown(); }, { passive: false });
            btn.addEventListener('mousedown', actionDown);
            if (actionUp) {
                btn.addEventListener('touchend', (e) => { e.preventDefault(); actionUp(); }, { passive: false });
                btn.addEventListener('mouseup', actionUp);
            }
        };

        bindBtn('btn-left', () => { if (!isGameOver && currentLane > -1) currentLane--; });
        bindBtn('btn-right', () => { if (!isGameOver && currentLane < 1) currentLane++; });
        bindBtn('btn-boost', () => { if (!isGameOver) currentSpeed = baseSpeed * 1.6; }, () => { currentSpeed = baseSpeed; });
        bindBtn('btn-brake', () => { 
            if (!isGameOver) { 
                currentSpeed = baseSpeed * 0.45; 
                playBrakeSound(0.4);
            } 
        }, () => { currentSpeed = baseSpeed; });

        // --- SPAWNING PROCEDURAL DE ENTORNO Y OBSTÁCULOS ---
        function spawnScenery() {
            // Generar árboles en los márgenes
            const side = Math.random() > 0.5 ? 1 : -1;
            const tree = createTree();
            tree.position.set(side * (8 + Math.random() * 15), 0, -120);
            scene.add(tree);
            scenery.push(tree);
        }

        function spawnObstacle() {
            if (isGameOver) return;
            const rand = Math.random();
            let obs = null;

            if (stage === 1) {
                obs = rand < 0.6 ? createCone() : createBlock();
            } else if (stage === 2) {
                if (rand < 0.3) obs = createCone();
                else if (rand < 0.5) obs = createBlock();
                else if (rand < 0.75) {
                    obs = createPedestrian();
                    spawnSign('pedestrian');
                } else {
                    obs = createAnimal();
                    spawnSign('animal');
                }
            } else {
                if (rand < 0.25) obs = createCone();
                else if (rand < 0.45) obs = createBlock();
                else if (rand < 0.7) {
                    obs = createPedestrian();
                    spawnSign('pedestrian');
                } else {
                    obs = createAnimal();
                    spawnSign('animal');
                }
            }

            const lane = Math.floor(Math.random() * 3) - 1;
            const isCrossing = (obs.userData && (obs.userData.type === 'pedestrian' || obs.userData.type === 'animal'));
            const posX = isCrossing ? (obs.userData.direction === 1 ? -6.5 : 6.5) : lanePositions[lane + 1];
            
            obs.position.set(posX, 0, -80);
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnSign(type) {
            const sign = createTrafficSign(type);
            sign.position.set(-6.8, 0, -110); // Aparece más adelante para advertir
            scene.add(sign);
            scenery.push(sign);
        }

        function spawnCollectible() {
            if (isGameOver) return;
            const group = new THREE.Group();

            const diamondGeo = new THREE.OctahedronGeometry(0.55);
            const diamondMat = new THREE.MeshStandardMaterial({ 
                color: 0xffcc00, 
                metalness: 0.8, 
                roughness: 0.1,
                transparent: true,
                opacity: 0.85
            });
            const diamond = new THREE.Mesh(diamondGeo, diamondMat);
            diamond.castShadow = true;
            group.add(diamond);

            const textCardGeo = new THREE.PlaneGeometry(0.7, 0.22);
            const textCardMat = new THREE.MeshBasicMaterial({ 
                map: extraGncTexture, 
                transparent: true, 
                side: THREE.DoubleSide 
            });
            const textCard = new THREE.Mesh(textCardGeo, textCardMat);
            textCard.position.z = 0.01;
            group.add(textCard);

            const lane = Math.floor(Math.random() * 3) - 1;
            group.position.set(lanePositions[lane + 1], 0.65, -80);
            scene.add(group);
            collectibles.push(group);
        }

        let spawnTimer = 0;
        let sceneryTimer = 0;

        // --- BUCLE PRINCIPAL DE ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                updateDifficultyAndEnvironment();

                const targetX = lanePositions[currentLane + 1];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;

                // Spawning periódico
                spawnTimer += 0.016;
                sceneryTimer += 0.016;

                if (sceneryTimer > 0.25) {
                    sceneryTimer = 0;
                    spawnScenery();
                }

                if (spawnTimer > spawnInterval) {
                    spawnTimer = 0;
                    if (Math.random() > 0.2) spawnObstacle();
                    if (Math.random() > 0.35) spawnCollectible();
                }

                // Mover Paisaje Lateral (Árboles y Señales)
                for (let i = scenery.length - 1; i >= 0; i--) {
                    const obj = scenery[i];
                    obj.position.z += currentSpeed;
                    if (obj.position.z > 10) {
                        scene.remove(obj);
                        scenery.splice(i, 1);
                    }
                }

                // Mover Obstáculos / Entidades
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += currentSpeed;

                    // Animación y Cruce de Peatón
                    if (obs.userData && obs.userData.type === 'pedestrian') {
                        obs.position.x += obs.userData.walkSpeed * obs.userData.direction;
                        obs.userData.animTimer += 0.15;
                        const angle = Math.sin(obs.userData.animTimer) * 0.45;
                        obs.userData.leftLeg.rotation.x = angle;
                        obs.userData.rightLeg.rotation.x = -angle;
                        obs.userData.leftArm.rotation.x = -angle;
                        obs.userData.rightArm.rotation.x = angle;
                    }

                    // Cruce de Animal
                    if (obs.userData && obs.userData.type === 'animal') {
                        obs.position.x += obs.userData.walkSpeed * obs.userData.direction;
                    }

                    // DETECCIÓN DE COLISIÓN
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 1.1 &&
                        Math.abs(obs.position.x - playerGroup.position.x) < 0.85) {
                        
                        // Perder todas las vidas al chocar peatón o animal suelto
                        if (obs.userData && (obs.userData.type === 'pedestrian' || obs.userData.type === 'animal')) {
                            lives = 0;
                        } else {
                            lives--;
                        }

                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        updateUI();
                        
                        if (lives <= 0) triggerGameOver();
                        continue;
                    }

                    if (obs.position.z > 6 || Math.abs(obs.position.x) > 12) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Mover Coleccionables EXTRA GNC
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const item = collectibles[i];
                    item.position.z += currentSpeed;
                    item.rotation.y += 0.04;

                    if (Math.abs(item.position.z - playerGroup.position.z) < 1.1 &&
                        Math.abs(item.position.x - playerGroup.position.x) < 0.85) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                        score += 15;
                        updateUI();
                        continue;
                    }

                    if (item.position.z > 6) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function updateUI() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('lives-val').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Puntuación Final: ${score}`;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            collectibles.forEach(item => scene.remove(item));
            scenery.forEach(item => scene.remove(item));
            obstacles.length = 0;
            collectibles.length = 0;
            scenery.length = 0;

            score = 0;
            stage = 1;
            lives = 3;
            baseSpeed = 0.45;
            currentSpeed = baseSpeed;
            currentLane = 0;
            isGameOver = false;

            playerGroup.position.set(0, 0, 0);
            updateUI();
            document.getElementById('game-over-screen').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            updateCameraFOV();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
