<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC Turbo Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* --- UI OVERLAY COMPLETO --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .btn-ui {
            background: #00bcd4;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            text-transform: uppercase;
            font-size: 12px;
        }

        .stats-container {
            display: flex;
            gap: 15px;
        }

        .stat-box {
            background: rgba(10, 25, 47, 0.85);
            border: 2px solid #00bcd4;
            color: #fff;
            padding: 6px 20px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            min-width: 110px;
        }

        .stat-box .label {
            font-size: 10px;
            color: #ffeb3b;
            display: block;
            margin-bottom: 2px;
        }

        .controls-layer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 10px;
        }

        .btn-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 188, 212, 0.3);
            border: 2px solid #00bcd4;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
        }

        .btn-pedal {
            background: rgba(0, 188, 212, 0.4);
            border: 2px solid #00bcd4;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 11px;
            pointer-events: auto;
            cursor: pointer;
        }
    </style>

    <!-- Essential Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay Reconstruida -->
    <div id="ui-layer">
        <div class="top-bar">
            <button class="btn-ui">🚗 VEHÍCULO</button>
            <div class="stats-container">
                <div class="stat-box">
                    <span class="label" id="stage-label">ETAPA: 1</span>
                    FÁCIL
                </div>
                <div class="stat-box">
                    PTS: <span id="score-val">60</span>
                </div>
                <div class="stat-box">
                    VIDAS: <span style="color: #ff4d4d;">♥</span>
                </div>
            </div>
            <button class="btn-ui">AUDIO</button>
        </div>

        <div class="controls-layer">
            <div style="display: flex; gap: 10px;">
                <div class="btn-circle">◄</div>
                <div class="btn-circle">►</div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn-pedal">freno</button>
                <div class="btn-circle" style="width: 40px; height: 40px; font-size: 12px;">▲</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, playerGroup;

        function init() {
            const canvas = document.getElementById('game-canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x6ba3b9);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.8, 6.5);
            camera.lookAt(0, 1, -10);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            // Pista con bordes fluorescentes
            createRoad();

            // Arboles decorativos laterales
            createTrees();

            // Intenta cargar el archivo .glb, o genera el buggy 3D si falla
            loadSelectedCarModel('modelo.glb');

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createRoad() {
            const roadGeo = new THREE.PlaneGeometry(12, 200);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            // Líneas cian laterales
            const borderGeo = new THREE.BoxGeometry(0.15, 0.05, 200);
            const borderMat = new THREE.MeshBasicMaterial({ color: 0x00bcd4 });
            
            const leftBorder = new THREE.Mesh(borderGeo, borderMat);
            leftBorder.position.set(-6, 0.02, 0);
            scene.add(leftBorder);

            const rightBorder = new THREE.Mesh(borderGeo, borderMat);
            rightBorder.position.set(6, 0.02, 0);
            scene.add(rightBorder);
        }

        function createTrees() {
            const treeGeo = new THREE.ConeGeometry(1.2, 4, 5);
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.2, 1);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, flatShading: true });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4e342e });

            for (let i = -80; i < 20; i += 12) {
                [-9, 9].forEach(x => {
                    const group = new THREE.Group();
                    const leaves = new THREE.Mesh(treeGeo, leafMat);
                    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                    leaves.position.y = 2.5;
                    trunk.position.y = 0.5;
                    leaves.castShadow = true;
                    group.add(leaves);
                    group.add(trunk);
                    group.position.set(x + (Math.random() - 0.5), 0, i);
                    scene.add(group);
                });
            }
        }

        function loadSelectedCarModel(modelPath) {
            while (playerGroup.children.length > 0) { 
                playerGroup.remove(playerGroup.children[0]); 
            }

            const gltfLoader = new THREE.GLTFLoader();
            
            gltfLoader.load(
                './' + modelPath,
                (gltf) => {
                    const loadedCar = gltf.scene;

                    loadedCar.traverse((child) => {
                        if (child.isMesh) {
                            const name = child.name.toLowerCase();
                            if (name.includes('base') || name.includes('pedestal') || name.includes('platform') || name.includes('stand') || name.includes('cube')) {
                                child.visible = false;
                            }
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    let box = new THREE.Box3().setFromObject(loadedCar);
                    let size = new THREE.Vector3();
                    box.getSize(size);
                    
                    const scaleFactor = 2.6 / (Math.max(size.x, size.y, size.z) || 1);
                    loadedCar.scale.set(scaleFactor, scaleFactor, scaleFactor);
                    
                    box = new THREE.Box3().setFromObject(loadedCar);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    
                    loadedCar.position.x = -center.x;
                    loadedCar.position.z = -center.z;
                    loadedCar.position.y = -box.min.y + 0.02; 

                    playerGroup.add(loadedCar);
                },
                undefined,
                (error) => {
                    // Carga alternativa: Karting 3D parametrizado (reemplazo automático de la caja)
                    buildProceduralBuggy();
                }
            );
        }

        // Genera el vehículo estructurado si no encuentra el archivo .glb
        function buildProceduralBuggy() {
            const buggy = new THREE.Group();

            // Chasis principal (Jaula)
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1565c0, metalness: 0.5 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });

            const baseBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 2.2), bodyMat);
            baseBody.position.y = 0.4;
            baseBody.castShadow = true;
            buggy.add(baseBody);

            // Jaula superior
            const cage = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 1.2), frameMat);
            cage.position.set(0, 0.8, -0.1);
            buggy.add(cage);

            // Ruedas
            const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.25, 16);
            wheelGeo.rotateZ(Math.PI / 2);

            const posRuedas = [
                [-0.7, 0.3, 0.8],  // DI
                [0.7, 0.3, 0.8],   // DD
                [-0.7, 0.3, -0.8], // TI
                [0.7, 0.3, -0.8]   // TD
            ];

            posRuedas.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                buggy.add(wheel);
            });

            // Número 22 Lateral
            const numberPlate = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            numberPlate.position.set(-0.61, 0.4, 0);
            numberPlate.rotation.y = -Math.PI / 2;
            buggy.add(numberPlate);

            playerGroup.add(buggy);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
