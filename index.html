<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC TURBO RACER 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- OVERLAY DE ESCANEO DE CÓDIGO --- */
        #scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .scan-box {
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .scan-box h1 {
            color: #ff9900;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.5);
        }

        .scan-box p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .barcode-input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 3px;
            background: #111;
            border: 1px solid #333;
            color: #00d2ff;
            border-radius: 6px;
            outline: none;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .barcode-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff0055, #ff9900);
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        #scan-status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            height: 20px;
        }

        /* --- HUD DEL JUEGO --- */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 20px;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid #00d2ff;
            padding: 10px 20px;
            border-radius: 4px;
            backdrop-filter: blur(5px);
        }

        .hud-card .label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
        }

        .hud-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        /* --- PANTALLA FIN DE JUEGO / CANJE --- */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 90;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .go-box {
            background: #111;
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        }

        .go-box h2 {
            font-size: 26px;
            color: #00d2ff;
            margin-bottom: 15px;
        }

        /* IMPRESORA TÉRMICA ESTILO RECEIPT */
        #receipt {
            background: #fff;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 20px 0;
            border-radius: 2px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 12px;
            line-height: 1.4;
        }

        #receipt .r-header {
            text-align: center;
            font-weight: bold;
            border-bottom: 1px dashed #000;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        #receipt .r-line {
            display: flex;
            justify-content: space-between;
        }

        #receipt .r-footer {
            border-top: 1px dashed #000;
            padding-top: 8px;
            margin-top: 8px;
            text-align: center;
            font-size: 10px;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- SCANNER OVERLAY -->
    <div id="scan-overlay">
        <div class="scan-box">
            <h1>GNC TURBO RACER 3D</h1>
            <p>Escanee o ingrese el código de ticket para ingresar al sistema:</p>
            <input type="text" id="barcode-input" class="barcode-input" placeholder="SEL-XXXXX" autofocus autocomplete="off">
            <button id="btn-submit" class="btn-action">JUGAR / VALIDAR</button>
            <div id="scan-status"></div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-card">
            <div class="label">Puntos</div>
            <div class="value" id="score-val">0</div>
        </div>
        <div class="hud-card">
            <div class="label">Presión GNC</div>
            <div class="value" id="turbo-val">100%</div>
        </div>
    </div>

    <!-- GAME OVER / CANJE SCREEN -->
    <div id="game-over-screen">
        <div class="go-box">
            <h2 id="go-title">FIN DE LA CARRERA</h2>
            <div id="final-score" style="font-size: 18px; margin-bottom: 10px;">Puntaje Final: <span id="go-score" style="color: #00ff88; font-weight: bold;">0</span></div>
            
            <div id="prize-result-box"></div>

            <button class="btn-action" style="margin-top: 15px;" onclick="location.reload();">VOLVER AL INICIO</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN WEB APP WEB_APP_URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwcQeY2p1IeFInK_5a83UpxaA6E78I5IqT2YdK1J5c-NnJ9e56S/exec"; 

        let activeTicketCode = "";
        let gameActive = false;
        let score = 0;
        let turbo = 100;

        const barcodeInput = document.getElementById('barcode-input');
        const btnSubmit = document.getElementById('btn-submit');
        const scanStatus = document.getElementById('scan-status');
        const scanOverlay = document.getElementById('scan-overlay');

        // EVENTOS DE ENTRADA DE CÓDIGO
        btnSubmit.addEventListener('click', () => {
            let code = barcodeInput.value.trim();
            if (code) validarCodigoTicket(code);
        });

        barcodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                let code = barcodeInput.value.trim();
                if (code) validarCodigoTicket(code);
            }
        });

        // VALIDACIÓN DUAL (INICIO JUEGO / CANJE)
        function validarCodigoTicket(codigo) {
            scanStatus.style.color = "#ffcc00";
            scanStatus.innerText = "Validando código...";
            barcodeInput.disabled = true;

            fetch(`${WEB_APP_URL}?action=validarCodigo&codigo=${encodeURIComponent(codigo)}`, { method: "GET", redirect: "follow" })
            .then(res => res.json())
            .then(data => {
                if (data.status === "DISPONIBLE" || data.status === "OK") {
                    // TICKET NUEVO -> ARRANCA EL JUEGO 3D
                    scanStatus.style.color = "#00ff88";
                    scanStatus.innerText = "¡CÓDIGO VÁLIDO! INICIANDO...";
                    activeTicketCode = codigo;
                    setTimeout(() => {
                        scanOverlay.style.display = 'none';
                        barcodeInput.value = "";
                        barcodeInput.disabled = false;
                        startGame();
                    }, 800);
                } else if (data.status === "JUGADO") {
                    // TICKET YA JUGADO -> PANTALLA DE CANJE EN CAJA
                    scanStatus.style.color = "#ffcc00";
                    scanStatus.innerText = "TICKET YA JUGADO - MODO CANJE";
                    
                    const premioTexto = data.premio || "Consulte en tabla";
                    const puntosTexto = data.puntos ? `${data.puntos} PTS` : "N/A";

                    document.getElementById('prize-result-box').innerHTML = `
                        <div id="receipt">
                            <div class="r-header">
                                *** SHELL GNC - VERIFICACIÓN ***<br>
                                CANJE DE PREMIO
                            </div>
                            <div class="r-line"><span>TICKET:</span> <strong>${codigo}</strong></div>
                            <div class="r-line"><span>ESTADO:</span> <strong>JUGADO</strong></div>
                            <div class="r-line"><span>PUNTOS:</span> <strong>${puntosTexto}</strong></div>
                            <hr style="border: 0.5px dashed #000; margin: 5px 0;">
                            <div class="r-line"><span>PREMIO:</span></div>
                            <div style="font-size: 15px; font-weight: bold; text-align: center; margin: 8px 0; color: #000;">
                                ${premioTexto}
                            </div>
                            <div class="r-footer">
                                Presente este ticket en caja<br>
                                ¡Gracias por su visita!
                            </div>
                        </div>
                    `;

                    document.getElementById('game-over-screen').style.display = 'flex';
                    document.getElementById('go-title').innerText = "CANJE DE PREMIO";
                    document.getElementById('final-score').style.display = 'none';

                    barcodeInput.value = "";
                    barcodeInput.disabled = false;
                } else if (data.status === "ENTREGADO") {
                    scanStatus.style.color = "#ff3355";
                    scanStatus.innerText = "ESTE PREMIO YA FUE ENTREGADO EN CAJA";
                    setTimeout(() => { barcodeInput.value = ""; barcodeInput.disabled = false; barcodeInput.focus(); }, 2000);
                } else {
                    scanStatus.style.color = "#ff3355";
                    scanStatus.innerText = data.message || "Código inválido";
                    setTimeout(() => { barcodeInput.value = ""; barcodeInput.disabled = false; barcodeInput.focus(); }, 1800);
                }
            })
            .catch(() => {
                scanStatus.style.color = "#ff3355";
                scanStatus.innerText = "Error de conexión con la base de datos";
                setTimeout(() => { barcodeInput.value = ""; barcodeInput.disabled = false; barcodeInput.focus(); }, 1800);
            });
        }

        // MOTOR TRES.JS Y LOGICA DEL JUEGO
        let scene, camera, renderer, playerBox;
        let laneIndex = 1; // 0: Izq, 1: Centro, 2: Der
        const lanes = [-2.5, 0, 2.5];

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff0055, 1);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Pista
            const trackGeo = new THREE.PlaneGeometry(10, 200);
            const trackMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.z = -80;
            scene.add(track);

            // Jugador (Auto 3D Simplificado)
            const playerGeo = new THREE.BoxGeometry(1.2, 0.6, 2.5);
            const playerMat = new THREE.MeshPhongMaterial({ color: 0x00d2ff, emissive: 0x003366 });
            playerBox = new THREE.Mesh(playerGeo, playerMat);
            playerBox.position.set(lanes[laneIndex], 0.3, 0);
            scene.add(playerBox);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', handleControls);
        }

        function handleControls(e) {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                if (laneIndex > 0) laneIndex--;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                if (laneIndex < 2) laneIndex++;
            }
        }

        function startGame() {
            init3D();
            gameActive = true;
            score = 0;
            animate();

            // Loop de puntos
            const scoreInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(scoreInterval);
                    return;
                }
                score += 10;
                document.getElementById('score-val').innerText = score;

                // Simulación de finalización de carrera tras alcanzar tiempo/distancia
                if (score >= 200) {
                    gameActive = false;
                    clearInterval(scoreInterval);
                    finalizarPartida();
                }
            }, 500);
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);

            // Suavizado de cambio de carril
            playerBox.position.x += (lanes[laneIndex] - playerBox.position.x) * 0.2;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // REGISTRAR RESULTADO DE LA PARTIDA AL FINALIZAR
        function finalizarPartida() {
            fetch(`${WEB_APP_URL}?action=registrarPartida&codigo=${encodeURIComponent(activeTicketCode)}&puntos=${score}`, { method: "GET", redirect: "follow" })
            .then(res => res.json())
            .then(data => {
                document.getElementById('go-score').innerText = score;
                document.getElementById('prize-result-box').innerHTML = `
                    <div id="receipt">
                        <div class="r-header">
                            *** SHELL GNC - TURBO RACER ***<br>
                            COMPROBANTE DE PREMIO
                        </div>
                        <div class="r-line"><span>CÓDIGO:</span> <strong>${activeTicketCode}</strong></div>
                        <div class="r-line"><span>PUNTAJE:</span> <strong>${score} PTS</strong></div>
                        <hr style="border: 0.5px dashed #000; margin: 5px 0;">
                        <div class="r-line"><span>PREMIO ASIGNADO:</span></div>
                        <div style="font-size: 14px; font-weight: bold; text-align: center; margin: 8px 0; color: #000;">
                            ${data.premioAsignado || 'Siga participando'}
                        </div>
                        <div class="r-footer">
                            Presente este ticket en la caja del Shop<br>
                            para retirar su premio.
                        </div>
                    </div>
                `;
                document.getElementById('game-over-screen').style.display = 'flex';
            })
            .catch(() => {
                alert("Error al guardar los resultados en la base de datos.");
                location.reload();
            });
        }
    </script>
</body>
</html>
