<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTRA GNC TURBO RACER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* OVERLAY DEL ESCÁNER DE CÓDIGO DE BARRAS */
        #scan-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 4, 8, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .scan-card {
            background: #0d111d;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.35);
            border-radius: 12px;
            padding: 35px 45px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .scan-card h2 {
            color: #00d2ff;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .scan-card p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 25px;
        }

        #barcode-input {
            padding: 14px 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #00d2ff;
            background: #161f30;
            color: #ffffff;
            border-radius: 8px;
            width: 100%;
            outline: none;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        #barcode-input:focus {
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
            border-color: #00e5ff;
        }

        #scan-status {
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #ffcc00;
            min-height: 22px;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INGRESO CON ESCÁNER -->
    <div id="scan-overlay">
        <div class="scan-card">
            <h2>🏎️ EXTRA GNC TURBO RACER</h2>
            <p>ESCANEE EL CÓDIGO DE SU TICKET PARA JUGAR</p>
            
            <input type="text" id="barcode-input" placeholder="Aguardando lectura..." autofocus autocomplete="off">
            
            <div id="scan-status">Aguardando código...</div>
        </div>
    </div>

    <!-- 2. AQUÍ VA EL CONTENIDO Y CANVAS DE TU JUEGO EXISTENTE -->
    <div id="game-container" style="width: 100vw; height: 100vh;">
        <!-- TU CANVAS O LÓGICA RENDERIZADORA DE CARRERA -->
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUe4u1ViXI-xj-PKUbVxFaCz1e8AKmVa5Ckh2haFyqu-EZL5hf7O0TrSIalZNdrayv3w/exec";
        let activeTicketCode = "";

        const barcodeInput = document.getElementById('barcode-input');
        const scanStatus = document.getElementById('scan-status');
        const scanOverlay = document.getElementById('scan-overlay');

        // MANTENER SIEMPRE EL FOCO EN EL INPUT DE LECTURA
        document.addEventListener('click', () => {
            if (scanOverlay.style.display !== 'none') {
                barcodeInput.focus();
            }
        });

        // SANITIZACIÓN AUTOMÁTICA DEL MAPEO DE TECLADO EN LA PISTOLA
        function limpiarCodigoLector(input) {
            return input.trim().toUpperCase()
                .replace(/'/g, "-")   // Convierte comilla simple a guion
                .replace(/\?/g, "-")  // Convierte signo ? a guion
                .replace(/_/g, "-");  // Normaliza guion bajo
        }

        // CAPTURA DE LECTURA DE LA PISTOLA (TECLA ENTER)
        barcodeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const codigoRaw = barcodeInput.value;
                const codigoLimpio = limpiarCodigoLector(codigoRaw);
                
                if (codigoLimpio !== "") {
                    barcodeInput.value = codigoLimpio;
                    validarCodigoTicket(codigoLimpio);
                }
            }
        });

        // CONSULTA A GOOGLE SHEETS
        function validarCodigoTicket(codigo) {
            scanStatus.style.color = "#ffcc00";
            scanStatus.innerText = "Verificando ticket...";
            barcodeInput.disabled = true;

            fetch(`${WEB_APP_URL}?action=validarCodigo&codigo=${encodeURIComponent(codigo)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "OK") {
                        scanStatus.style.color = "#00ff88";
                        scanStatus.innerText = "¡CÓDIGO VÁLIDO! INICIANDO...";
                        activeTicketCode = codigo;

                        setTimeout(() => {
                            // OCULTA EL OVERLAY PARA MOSTRAR EL JUEGO
                            scanOverlay.style.display = 'none';
                            barcodeInput.value = "";
                            barcodeInput.disabled = false;
                            
                            // LLAMADA A LA FUNCIÓN QUE INICIA EL JUEGO
                            if (typeof iniciarJuego === "function") {
                                iniciarJuego();
                            }
                        }, 1000);
                    } else {
                        scanStatus.style.color = "#ff3355";
                        scanStatus.innerText = data.message || "Código inválido o ya usado";
                        setTimeout(() => {
                            barcodeInput.value = "";
                            barcodeInput.disabled = false;
                            barcodeInput.focus();
                        }, 1500);
                    }
                })
                .catch(err => {
                    scanStatus.style.color = "#ff3355";
                    scanStatus.innerText = "Error de conexión con la base de datos";
                    setTimeout(() => {
                        barcodeInput.value = "";
                        barcodeInput.disabled = false;
                        barcodeInput.focus();
                    }, 1500);
                });
        }

        // GUARDADO DE PUNTAJE AL FINALIZAR LA PARTIDA
        function guardarResultadoPartida(puntos) {
            if (!activeTicketCode) return;

            fetch(`${WEB_APP_URL}?action=registrarPartida&codigo=${encodeURIComponent(activeTicketCode)}&puntos=${puntos}`)
                .then(res => res.json())
                .then(data => {
                    console.log("Resultado guardado correctamente:", data);
                })
                .catch(err => console.error("Error al registrar puntaje:", err));
        }
    </script>
</body>
</html>
