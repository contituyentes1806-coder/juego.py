<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC TURBO RACER 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background-color: #080911; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .ui-box {
            background: rgba(10, 10, 20, 0.85);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            padding: 8px 16px;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
            text-align: center;
            min-width: 90px;
        }

        #controls-container {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
            pointer-events: none;
        }

        .btn-group { 
            display: flex; 
            gap: 12px; 
            pointer-events: auto;
        }

        .control-btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            cursor: pointer;
        }

        .control-btn:active {
            background: rgba(0, 210, 255, 0.4);
            transform: scale(0.92);
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }

        #game-over-screen h1 {
            font-size: 42px;
            color: #ff3333;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.8);
        }

        #restart-btn {
            margin-top: 20px;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="ui-box">NIVEL: <span id="level-val">1</span></div>
        <div class="ui-box">PTS: <span id="score-val">0</span> / 100</div>
        <div class="ui-box">VIDAS: <span id="lives-val">❤️❤️❤️</span></div>
    </div>

    <div id="controls-container">
        <div class="btn-group">
            <div class="control-btn" id="btn-left">❮</div>
            <div class="control-btn" id="btn-right">❯</div>
        </div>
        <div class="btn-group">
            <div class="control-btn" id="btn-brake">🛑</div>
            <div class="control-btn" id="btn-boost">⚡</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>¡GAME OVER!</h1>
        <p id="final-score" style="font-size: 20px;">Puntuación Final: 0</p>
        <button id="restart-btn" onclick="resetGame()">REINTENTAR</button>
    </div>

    <script>
        // --- ESCENA Y CONFIGURACIÓN ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080911);
        scene.fog = new THREE.Fog(0x080911, 20, 80);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- PISTA Y LÍNEAS DE CARRIL ---
        const roadGeo = new THREE.PlaneGeometry(10, 1000);
        const roadMat = new THREE.MeshPhongMaterial({ color: 0x1a1a20, shininess: 10 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -450;
        road.receiveShadow = true;
        scene.add(road);

        // Delimitadores fluorescentes en los bordes de la pista
        const lineGeo = new THREE.PlaneGeometry(0.15, 1000);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });

        const leftLine = new THREE.Mesh(lineGeo, lineMat);
        leftLine.rotation.x = -Math.PI / 2;
        leftLine.position.set(-4.85, 0.02, -450);
        scene.add(leftLine);

        const rightLine = new THREE.Mesh(lineGeo, lineMat);
        rightLine.rotation.x = -Math.PI / 2;
        rightLine.position.set(4.85, 0.02, -450);
        scene.add(rightLine);

        // --- AUTO 3D COMPUESTO ---
        const playerGroup = new THREE.Group();

        // Materiales
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0x00a8ff, shininess: 90 });
        const roofMat = new THREE.MeshPhongMaterial({ color: 0x111115, shininess: 100 });
        const wheelMat = new THREE.MeshPhongMaterial({ color: 0x151515, shininess: 30 });
        const tailLightMat = new THREE.MeshStandardMaterial({ 
            color: 0xff0033, 
            emissive: 0xff0033, 
            emissiveIntensity: 0.8 
        });

        // Carrocería
        const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.45, 2.8), bodyMat);
        bodyMesh.position.y = 0.4;
        bodyMesh.castShadow = true;
        playerGroup.add(bodyMesh);

        // Techo / Cristales
        const roofMesh = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.4, 1.3), roofMat);
        roofMesh.position.set(0, 0.75, -0.1);
        roofMesh.castShadow = true;
        playerGroup.add(roofMesh);

        // Alerón
        const wingMesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.35), bodyMat);
        wingMesh.position.set(0, 0.9, 1.15);
        wingMesh.castShadow = true;
        playerGroup.add(wingMesh);

        const sup1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.25, 0.1), bodyMat);
        sup1.position.set(-0.5, 0.72, 1.15);
        playerGroup.add(sup1);

        const sup2 = sup1.clone();
        sup2.position.set(0.5, 0.72, 1.15);
        playerGroup.add(sup2);

        // Luces Traseras
        const lightL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.1, 0.05), tailLightMat);
        lightL.position.set(-0.45, 0.48, 1.38);
        playerGroup.add(lightL);

        const lightR = lightL.clone();
        lightR.position.set(0.45, 0.48, 1.38);
        playerGroup.add(lightR);

        // Ruedas 3D
        const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.25, 18);
        wheelGeo.rotateZ(Math.PI / 2);

        const wheelCoords = [
            [-0.8, 0.32, 0.85],
            [0.8, 0.32, 0.85],
            [-0.8, 0.32, -0.85],
            [0.8, 0.32, -0.85]
        ];

        wheelCoords.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.position.set(...pos);
            w.castShadow = true;
            playerGroup.add(w);
        });

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // Configuración de Cámara Tercera Persona
        playerGroup.add(camera);
        camera.position.set(0, 3.2, 5.8);
        camera.lookAt(0, 0.5, -5);

        // --- ESTADO DEL JUEGO ---
        let currentLane = 0;
        const lanePositions = [-3, 0, 3];
        let score = 0;
        let level = 1;
        let lives = 3;
        let baseSpeed = 0.45;
        let currentSpeed = baseSpeed;
        let isGameOver = false;

        const obstacles = [];
        const collectibles = [];

        // --- CONTROLES TECLADO Y TOUCH ---
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > -1) currentLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 1) currentLane++;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') currentSpeed = baseSpeed * 1.8;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') currentSpeed = baseSpeed * 0.5;
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'w', 'W', 'ArrowDown', 's', 'S'].includes(e.key)) currentSpeed = baseSpeed;
        });

        const bindBtn = (id, actionDown, actionUp) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionDown(); }, { passive: false });
            btn.addEventListener('mousedown', actionDown);
            if (actionUp) {
                btn.addEventListener('touchend', (e) => { e.preventDefault(); actionUp(); }, { passive: false });
                btn.addEventListener('mouseup', actionUp);
            }
        };

        bindBtn('btn-left', () => { if (!isGameOver && currentLane > -1) currentLane--; });
        bindBtn('btn-right', () => { if (!isGameOver && currentLane < 1) currentLane++; });
        bindBtn('btn-boost', () => { if (!isGameOver) currentSpeed = baseSpeed * 1.8; }, () => { currentSpeed = baseSpeed; });
        bindBtn('btn-brake', () => { if (!isGameOver) currentSpeed = baseSpeed * 0.5; }, () => { currentSpeed = baseSpeed; });

        // --- GENERACIÓN DE ENTIDADES ---
        function spawnObstacle() {
            if (isGameOver) return;
            const obsMat = new THREE.MeshPhongMaterial({ color: 0xee3333, shininess: 40 });
            const obs = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), obsMat);
            obs.castShadow = true;
            obs.receiveShadow = true;

            const lane = Math.floor(Math.random() * 3) - 1;
            obs.position.set(lanePositions[lane + 1], 0.6, -75);
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnCollectible() {
            if (isGameOver) return;
            const itemMat = new THREE.MeshPhongMaterial({ color: 0xffcc00, shininess: 100, specular: 0xffffff });
            const item = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), itemMat);
            item.castShadow = true;

            const lane = Math.floor(Math.random() * 3) - 1;
            item.position.set(lanePositions[lane + 1], 0.6, -75);
            scene.add(item);
            collectibles.push(item);
        }

        let spawnTimer = 0;

        // --- BUCLE PRINCIPAL DE ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                // Suavizado de cambio de carril
                const targetX = lanePositions[currentLane + 1];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;

                // Generación periódica
                spawnTimer += 0.016;
                if (spawnTimer > 1.1) {
                    spawnTimer = 0;
                    if (Math.random() > 0.35) spawnObstacle();
                    if (Math.random() > 0.3) spawnCollectible();
                }

                // Desplazamiento y colisión de obstáculos
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += currentSpeed;
                    obs.rotation.y += 0.015;

                    if (Math.abs(obs.position.z - playerGroup.position.z) < 1.1 &&
                        Math.abs(obs.position.x - playerGroup.position.x) < 0.85) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        lives--;
                        updateUI();
                        if (lives <= 0) triggerGameOver();
                        continue;
                    }

                    if (obs.position.z > 6) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Desplazamiento y colisión de coleccionables
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const item = collectibles[i];
                    item.position.z += currentSpeed;
                    item.rotation.y += 0.04;

                    if (Math.abs(item.position.z - playerGroup.position.z) < 1.1 &&
                        Math.abs(item.position.x - playerGroup.position.x) < 0.85) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                        score += 5;
                        if (score >= level * 100) {
                            level++;
                            baseSpeed += 0.05;
                        }
                        updateUI();
                        continue;
                    }

                    if (item.position.z > 6) {
                        scene.remove(item);
                        collectibles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function updateUI() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('level-val').innerText = level;
            document.getElementById('lives-val').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Puntuación Final: ${score}`;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            collectibles.forEach(item => scene.remove(item));
            obstacles.length = 0;
            collectibles.length = 0;

            score = 0;
            level = 1;
            lives = 3;
            baseSpeed = 0.45;
            currentSpeed = baseSpeed;
            currentLane = 0;
            isGameOver = false;

            playerGroup.position.set(0, 0, 0);
            updateUI();
            document.getElementById('game-over-screen').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
