<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GNC TURBO RACER 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030408;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      touch-action: none;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Botón Configuración ⚙️ */
    #settings-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-size: 22px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Modal de Configuración y Clave */
    #settings-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .modal-box {
      background: #111420;
      border: 2px solid #00f0ff;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }

    .modal-box h3 {
      color: #00f0ff;
      margin-bottom: 15px;
    }

    .modal-input, .modal-select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #1b2033;
      color: #fff;
      border: 1px solid #3d496e;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
    }

    .modal-btn {
      width: 100%;
      padding: 10px;
      background: #00f0ff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      color: #000;
      margin-bottom: 5px;
    }

    .modal-btn-cancel {
      background: #3d496e;
      color: white;
    }

    /* Clases de Rotación para Modo TV */
    .rotate-90 {
      transform: rotate(90deg) !important;
      transform-origin: center !important;
      width: 100vh !important;
      height: 100vw !important;
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      margin-top: -50vw !important;
      margin-left: -50vh !important;
    }

    .rotate-270 {
      transform: rotate(-90deg) !important;
      transform-origin: center !important;
      width: 100vh !important;
      height: 100vw !important;
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      margin-top: -50vw !important;
      margin-left: -50vh !important;
    }
  </style>

  <!-- CDNs de Three.js y GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="game-container">
    <button id="settings-btn" onclick="openSettingsModal()">⚙️</button>

    <!-- Modal de Autenticación y Control -->
    <div id="settings-modal">
      <div class="modal-box">
        
        <!-- Sección 1: Validación de Clave -->
        <div id="auth-section">
          <h3>Acceso Restringido</h3>
          <input type="password" id="admin-pass" class="modal-input" placeholder="Clave de operador">
          <div id="auth-error" style="color: #ff4757; font-size: 12px; display: none; margin-bottom: 10px;">Clave incorrecta</div>
          <button class="modal-btn" onclick="validatePassword()">INGRESAR</button>
          <button class="modal-btn modal-btn-cancel" onclick="closeSettingsModal()">Cancelar</button>
        </div>

        <!-- Sección 2: Panel de Opciones -->
        <div id="controls-section" style="display: none;">
          <h3>Configuración</h3>
          
          <label style="display:block; margin-bottom: 5px; font-size: 12px;">Modelo de Auto:</label>
          <select id="car-select" class="modal-select" onchange="changeCarModel(this.value)">
            <option value="player_car.glb">Auto Original (Estándar)</option>
            <option value="Lamborghini.glb">Lamborghini</option>
            <option value="junikastudio-toys-160.glb">Junika Toys</option>
            <option value="wings_of_freedom-automobile-2718.glb">Wings of Freedom</option>
          </select>

          <label style="display:block; margin-bottom: 5px; font-size: 12px;">Volumen Master:</label>
          <input type="range" id="master-volume" min="0" max="100" value="100" style="width: 100%; margin-bottom: 15px;">

          <label style="display:block; margin-bottom: 5px; font-size: 12px;">Modo Pantalla / TV:</label>
          <select id="display-mode" class="modal-select" onchange="applyDisplayMode(this.value)">
            <option value="normal">Horizontal Estándar</option>
            <option value="rotate-90">TV Vertical (90°)</option>
            <option value="rotate-270">TV Vertical (270°)</option>
          </select>

          <button class="modal-btn" onclick="closeSettingsModal()">GUARDAR Y CERRAR</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "118308";
    let scene, camera, renderer, loader;
    let playerCar = null;

    function init() {
      const container = document.getElementById('game-container');

      // Escena 3D
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030408);

      // Cámara
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3, -7);
      camera.lookAt(0, 0, 2);

      // Renderizador
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Luces
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(5, 10, -5);
      scene.add(dirLight);

      // Suelo / Grilla
      const gridHelper = new THREE.GridHelper(100, 50, 0x00f0ff, 0x1b2033);
      scene.add(gridHelper);

      // Cargador 3D
      loader = new THREE.GLTFLoader();

      // Cargar modelo guardado o el valor por defecto
      const savedCar = localStorage.getItem('selectedCar') || 'player_car.glb';
      document.getElementById('car-select').value = savedCar;
      loadCarModel(savedCar);

      // Evento Resize
      window.addEventListener('resize', onWindowResize);

      // Bucle de Animación
      animate();
    }

    function loadCarModel(modelPath) {
      if (playerCar) {
        scene.remove(playerCar);
      }

      loader.load(
        './' + modelPath,
        function (gltf) {
          playerCar = gltf.scene;

          // Normalización de escala y posición automática
          const box = new THREE.Box3().setFromObject(playerCar);
          const size = new THREE.Vector3();
          box.getSize(size);

          // Ajusta el modelo a un tamaño estándar de 3.5 unidades de largo
          const targetLength = 3.5;
          const maxDim = Math.max(size.x, size.y, size.z);
          const scaleFactor = targetLength / (maxDim || 1);

          playerCar.scale.set(scaleFactor, scaleFactor, scaleFactor);

          // Recalcula la caja con la nueva escala para apoyar el auto sobre la pista
          const scaledBox = new THREE.Box3().setFromObject(playerCar);
          const center = new THREE.Vector3();
          scaledBox.getCenter(center);

          playerCar.position.x = -center.x;
          playerCar.position.y = -scaledBox.min.y; // Apoya las ruedas exactamente sobre Y = 0
          playerCar.position.z = -center.z;

          scene.add(playerCar);
        },
        undefined,
        function (error) {
          console.error("Error al cargar " + modelPath + ":", error);
          // Fallback de contingencia si el modelo falla
          const geo = new THREE.BoxGeometry(1.5, 0.8, 3);
          const mat = new THREE.MeshStandardMaterial({ color: 0x00f0ff });
          playerCar = new THREE.Mesh(geo, mat);
          playerCar.position.set(0, 0.4, 0);
          scene.add(playerCar);
        }
      );
    }

    function changeCarModel(newModel) {
      localStorage.setItem('selectedCar', newModel);
      loadCarModel(newModel);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* Modal & Seguridad */
    function openSettingsModal() {
      document.getElementById('settings-modal').style.display = 'flex';
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('controls-section').style.display = 'none';
      document.getElementById('admin-pass').value = '';
      document.getElementById('auth-error').style.display = 'none';
    }

    function validatePassword() {
      const inputPass = document.getElementById('admin-pass').value;
      if (inputPass === ADMIN_PASS) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('controls-section').style.display = 'block';
      } else {
        document.getElementById('auth-error').style.display = 'block';
      }
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function applyDisplayMode(mode) {
      const container = document.getElementById('game-container');
      container.classList.remove('rotate-90', 'rotate-270');
      if (mode === 'rotate-90') container.classList.add('rotate-90');
      if (mode === 'rotate-270') container.classList.add('rotate-270');
      onWindowResize();
    }

    // Permitir Enter en el input de clave
    document.getElementById('admin-pass').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') validatePassword();
    });

    // Inicializar el juego
    window.onload = init;
  </script>
</body>
</html>
