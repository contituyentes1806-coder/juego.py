<!-- PANTALLA DE VALIDACIÓN (OVERLAY DE ESCANEO) -->
<div id="scan-overlay" style="position: absolute; inset: 0; background: rgba(3, 4, 8, 0.95); z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;">
    <h2 style="color: #00d2ff; margin-bottom: 15px;">🏁 EXTRA GNC TURBO RACER</h2>
    <p style="font-size: 18px; margin-bottom: 20px;">ESCANEE EL CÓDIGO DE SU TICKET PARA JUGAR</p>
    
    <input type="text" id="barcode-input" placeholder="Aguardando lectura..." autofocus 
           style="padding: 12px 20px; font-size: 20px; text-align: center; border: 2px solid #00d2ff; background: #111; color: #fff; border-radius: 8px; width: 280px; outline: none;">
    
    <p id="scan-status" style="margin-top: 15px; font-weight: bold; font-size: 16px; color: #ffcc00; height: 24px;"></p>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUe4u1ViXI-xj-PKUbVxFaCz1e8AKmVa5Ckh2haFyqu-EZL5hf7O0TrSIalZNdrayv3w/exec";
    let activeTicketCode = "";

    const barcodeInput = document.getElementById('barcode-input');
    const scanStatus = document.getElementById('scan-status');
    const scanOverlay = document.getElementById('scan-overlay');

    // Mantener siempre el foco en el input para la pistola lectora
    document.addEventListener('click', () => {
        if (scanOverlay.style.display !== 'none') {
            barcodeInput.focus();
        }
    });

    // Detectar cuando la pistola envía "Enter"
    barcodeInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const codigo = barcodeInput.value.trim();
            if (codigo !== "") {
                validarCodigoTicket(codigo);
            }
        }
    });

    // Función para validar contra Google Sheets
    function validarCodigoTicket(codigo) {
        scanStatus.style.color = "#ffcc00";
        scanStatus.innerText = "Verificando ticket...";
        barcodeInput.disabled = true;

        fetch(`${WEB_APP_URL}?action=validarCodigo&codigo=${encodeURIComponent(codigo)}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "OK") {
                    scanStatus.style.color = "#00ff88";
                    scanStatus.innerText = "¡CÓDIGO VÁLIDO! INICIANDO...";
                    activeTicketCode = codigo;

                    setTimeout(() => {
                        scanOverlay.style.display = 'none';
                        barcodeInput.value = "";
                        barcodeInput.disabled = false;
                        initAudio(); // Inicia audio al arrancar
                    }, 1200);
                } else {
                    scanStatus.style.color = "#ff3355";
                    scanStatus.innerText = data.message || "Código inválido o ya usado";
                    barcodeInput.value = "";
                    barcodeInput.disabled = false;
                    barcodeInput.focus();
                }
            })
            .catch(err => {
                scanStatus.style.color = "#ff3355";
                scanStatus.innerText = "Error de conexión con la base de datos";
                barcodeInput.value = "";
                barcodeInput.disabled = false;
                barcodeInput.focus();
            });
    }

    // Función a llamar cuando el jugador pierde (Game Over)
    function guardarResultadoPartida(puntos) {
        if (!activeTicketCode) return;

        fetch(`${WEB_APP_URL}?action=registrarPartida&codigo=${encodeURIComponent(activeTicketCode)}&puntos=${puntos}`)
            .then(res => res.json())
            .then(data => {
                console.log("Partida registrada exitosamente:", data);
            })
            .catch(err => console.error("Error al guardar partida:", err));
    }
</script>
