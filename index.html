<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTRA GNC TURBO RACER</title>
    <!-- Carga de Three.js para el renderizado 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* LIENZO DE THREE.JS */
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* INTERFAZ HUD DE PUNTAJE */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #00e5ff;
            font-size: 22px;
            font-weight: bold;
            font-family: monospace;
            background: rgba(5, 8, 17, 0.75);
            padding: 12px 24px;
            border-radius: 8px;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            display: none;
        }

        /* OVERLAY DEL ESCÁNER */
        #scan-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 4, 8, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .scan-card {
            background: #0d111d;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.35);
            border-radius: 12px;
            padding: 35px 45px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .scan-card h2 {
            color: #00d2ff;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .scan-card p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 25px;
        }

        #barcode-input {
            padding: 14px 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #00d2ff;
            background: #161f30;
            color: #ffffff;
            border-radius: 8px;
            width: 100%;
            outline: none;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        #barcode-input:focus {
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
            border-color: #00e5ff;
        }

        #scan-status {
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #ffcc00;
            min-height: 22px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE INGRESO (ESCÁNER DE TICKET) -->
    <div id="scan-overlay">
        <div class="scan-card">
            <h2>🏎️ EXTRA GNC TURBO RACER</h2>
            <p>ESCANEE EL CÓDIGO DE SU TICKET PARA JUGAR</p>
            
            <input type="text" id="barcode-input" placeholder="Aguardando lectura..." autofocus autocomplete="off">
            
            <div id="scan-status">Aguardando código...</div>
        </div>
    </div>

    <!-- PANTALLA DEL JUEGO -->
    <div id="hud">PUNTOS: <span id="score-val">0</span></div>
    <div id="game-container"></div>

    <script>
        // CONFIGURACIÓN DE CONEXIÓN A GOOGLE APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUe4u1ViXI-xj-PKUbVxFaCz1e8AKmVa5Ckh2haFyqu-EZL5hf7O0TrSIalZNdrayv3w/exec";
        let activeTicketCode = "";
        let gameRunning = false;
        let score = 0;

        // ELEMENTOS DOM
        const barcodeInput = document.getElementById('barcode-input');
        const scanStatus = document.getElementById('scan-status');
        const scanOverlay = document.getElementById('scan-overlay');
        const hud = document.getElementById('hud');

        // MANTENER FOCO CONSTANTE EN EL ESCÁNER
        document.addEventListener('click', () => {
            if (scanOverlay.style.display !== 'none') {
                barcodeInput.focus();
            }
        });

        // LIMPIEZA Y SANITIZACIÓN DEL TECLADO DEL ESCÁNER DE BARRAS
        function limpiarCodigoLector(input) {
            return input.trim().toUpperCase()
                .replace(/'/g, "-")
                .replace(/\?/g, "-")
                .replace(/_/g, "-");
        }

        // CAPTURA DE EVENTO ENTER (ESCANEO)
        barcodeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const codigoLimpio = limpiarCodigoLector(barcodeInput.value);
                if (codigoLimpio !== "") {
                    barcodeInput.value = codigoLimpio;
                    validarCodigoTicket(codigoLimpio);
                }
            }
        });

        // PETICIÓN HTTP A GOOGLE APPS SCRIPT
        function validarCodigoTicket(codigo) {
            scanStatus.style.color = "#ffcc00";
            scanStatus.innerText = "Verificando ticket...";
            barcodeInput.disabled = true;

            fetch(`${WEB_APP_URL}?action=validarCodigo&codigo=${encodeURIComponent(codigo)}`, {
                method: "GET",
                redirect: "follow"
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "OK") {
                    scanStatus.style.color = "#00ff88";
                    scanStatus.innerText = "¡CÓDIGO VÁLIDO! INICIANDO...";
                    activeTicketCode = codigo;

                    setTimeout(() => {
                        scanOverlay.style.display = 'none';
                        hud.style.display = 'block';
                        barcodeInput.value = "";
                        barcodeInput.disabled = false;
                        
                        // INICIA EL JUEGO 3D
                        iniciarJuego();
                    }, 800);
                } else {
                    scanStatus.style.color = "#ff3355";
                    scanStatus.innerText = data.message || "Código inválido o ya usado";
                    setTimeout(() => {
                        barcodeInput.value = "";
                        barcodeInput.disabled = false;
                        barcodeInput.focus();
                    }, 1500);
                }
            })
            .catch(err => {
                scanStatus.style.color = "#ff3355";
                scanStatus.innerText = "Error de conexión con la base de datos";
                setTimeout(() => {
                    barcodeInput.value = "";
                    barcodeInput.disabled = false;
                    barcodeInput.focus();
                }, 1500);
            });
        }

        // REGISTRO DE PUNTAJE EN LA PESTAÑA Partidas_Registradas
        function guardarResultadoPartida(puntos) {
            if (!activeTicketCode) return;

            fetch(`${WEB_APP_URL}?action=registrarPartida&codigo=${encodeURIComponent(activeTicketCode)}&puntos=${puntos}`, {
                method: "GET",
                redirect: "follow"
            })
            .then(res => res.json())
            .then(data => console.log("Partida guardada:", data))
            .catch(err => console.error("Error al guardar partida:", err));
        }

        // ==========================================
        // MOTOR DE JUEGO 3D (THREE.JS COMPLETO)
        // ==========================================
        let scene, camera, renderer, playerCar, road, lines = [];

        function initThreeJS() {
            const container = document.getElementById('game-container');
            
            // 1. Escena, Cámara y Niebla
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050811);
            scene.fog = new THREE.FogExp2(0x050811, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.2, 7);
            camera.lookAt(0, 1.2, 0);

            // 2. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 3. Luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00e5ff, 1.2);
            dirLight.position.set(5, 12, 8);
            scene.add(dirLight);

            // 4. Pista de Carreras
            const roadGeo = new THREE.PlaneGeometry(10, 400);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x111625, roughness: 0.6 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -150;
            scene.add(road);

            // Líneas delimitadoras de la pista
            for (let i = 0; i < 20; i++) {
                const lineGeo = new THREE.PlaneGeometry(0.3, 4);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.01, -i * 15);
                scene.add(line);
                lines.push(line);
            }

            // 5. Creación del Auto (Carrocería + Cabina + Ruedas)
            const carGroup = new THREE.Group();

            // Chasis
            const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 3.4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            carGroup.add(body);

            // Cabina
            const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.6);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x09101d, roughness: 0.1, metalness: 0.9 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.9, -0.2);
            carGroup.add(cabin);

            // Ruedas
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            
            const positions = [
                [-1, 0.35, 1.1],
                [1, 0.35, 1.1],
                [-1, 0.35, -1.1],
                [1, 0.35, -1.1]
            ];

            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                carGroup.add(wheel);
            });

            playerCar = carGroup;
            playerCar.position.set(0, 0, 2);
            scene.add(playerCar);

            // Controles teclado (Flechas o A/D)
            window.addEventListener('keydown', (e) => {
                if (!gameRunning) return;
                if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && playerCar.position.x > -3.2) {
                    playerCar.position.x -= 0.8;
                }
                if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && playerCar.position.x < 3.2) {
                    playerCar.position.x += 0.8;
                }
            });

            // Ajuste Responsivo del Navegador
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Primer renderizado de la escena estática
            renderer.render(scene, camera);
        }

        // CONTROL DE FLUJO DEL JUEGO
        function iniciarJuego() {
            gameRunning = true;
            score = 0;
            document.getElementById('score-val').innerText = score;
            animate();
        }

        // BUCLE PRINCIPAL DE ANIMACIÓN
        function animate() {
            if (!gameRunning) return;

            requestAnimationFrame(animate);

            // Aumento de Puntaje
            score += 1;
            document.getElementById('score-val').innerText = score;

            // Animación de la Pista (Efecto de velocidad)
            lines.forEach(line => {
                line.position.z += 0.8;
                if (line.position.z > 5) {
                    line.position.z = -255;
                }
            });

            // Renderizado 3D continuo
            renderer.render(scene, camera);
        }

        // FINALIZACIÓN DE PARTIDA Y PERSISTENCIA
        function finalizarPartida() {
            gameRunning = false;
            guardarResultadoPartida(score);
            
            alert(`Partida finalizada. Puntaje total registrado: ${score}`);
            
            hud.style.display = 'none';
            scanOverlay.style.display = 'flex';
            barcodeInput.focus();
        }

        // INICIALIZAR THREE.JS AL CARGAR EL DOM
        window.onload = initThreeJS;
    </script>
</body>
</html>
