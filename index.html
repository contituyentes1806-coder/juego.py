<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC Turbo Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
    <!-- Cargamos Three.js y GLTFLoader desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <script>
        // 1. Configuración de la Escena, Cámara y Renderizador
        let scene, camera, renderer, playerGroup;

        function init() {
            const canvas = document.getElementById('game-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Color de cielo azul claro

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Iluminación básica
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Grupo para el auto del jugador
            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            // Plano del suelo / Pista
            const roadGeometry = new THREE.PlaneGeometry(10, 100);
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            // Ajuste al redimensionar ventana
            window.addEventListener('resize', onWindowResize);

            // Cargar modelo del vehículo (reemplazá 'modelo.glb' por la ruta de tu archivo)
            loadSelectedCarModel('modelo.glb');

            // Bucle de animación
            animate();
        }

        // 2. Función de Carga y Limpieza del Modelo 3D
        function loadSelectedCarModel(modelPath) {
            // Limpiar modelos previas del grupo
            while (playerGroup.children.length > 0) { 
                const child = playerGroup.children[0];
                playerGroup.remove(child);
                if (child.isMesh) {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                }
            }

            if (modelPath === 'default' || !modelPath) {
                buildDefaultCar();
                return;
            }

            const gltfLoader = new THREE.GLTFLoader();
            
            gltfLoader.load(
                './' + modelPath,
                (gltf) => {
                    const loadedCar = gltf.scene;

                    // Ocultar la base o plataforma gris si existe en el archivo
                    loadedCar.traverse((child) => {
                        if (child.isMesh) {
                            const name = child.name.toLowerCase();
                            if (
                                name.includes('base') || 
                                name.includes('pedestal') || 
                                name.includes('platform') || 
                                name.includes('stand') || 
                                name.includes('cube') ||
                                name.includes('plataforma')
                            ) {
                                child.visible = false;
                            }
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    // Escalar el vehículo de manera uniforme
                    let box = new THREE.Box3().setFromObject(loadedCar);
                    let size = new THREE.Vector3();
                    box.getSize(size);
                    
                    const targetLength = 2.6;
                    const maxDimension = Math.max(size.x, size.y, size.z) || 1;
                    const scaleFactor = targetLength / maxDimension;
                    loadedCar.scale.set(scaleFactor, scaleFactor, scaleFactor);
                    
                    // Centrar y posicionar las ruedas sobre el asfalto (Y = 0)
                    box = new THREE.Box3().setFromObject(loadedCar);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    
                    loadedCar.position.x = -center.x;
                    loadedCar.position.z = -center.z;
                    loadedCar.position.y = -box.min.y + 0.05; 

                    playerGroup.add(loadedCar);
                },
                undefined,
                (error) => {
                    console.error("Error al cargar el modelo GLB:", error);
                    buildDefaultCar();
                }
            );
        }

        // Auto por defecto en caso de fallo
        function buildDefaultCar() {
            const geometry = new THREE.BoxGeometry(1.2, 0.6, 2.2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const defaultCar = new THREE.Mesh(geometry, material);
            defaultCar.position.y = 0.3;
            defaultCar.castShadow = true;
            playerGroup.add(defaultCar);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Inicializar cuando la página esté cargada
        window.onload = init;
    </script>
</body>
</html>
